objective: "Practice using % to find the remainder left over after dividing."
explanation: |
  Let's practice % again — it gives you the remainder left over after dividing.

  13 % 4 is 1, because 4 goes into 13 three times with 1 left over.
example_code: |
  print(13 % 4)
starter_code: |
  print(13 % 4)
challenge: |
  🎯 Challenge: You pack 29 crayons into boxes of 6. Can you make Python print how many crayons are left over?
expected_output: "5"
hints:
