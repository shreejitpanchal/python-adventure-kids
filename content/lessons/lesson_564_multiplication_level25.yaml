id: lesson_564
title: "Multiplication: Level 25 ✖️"
level: 564
objective: "Round a multiplication result to a specific number of decimal digits."
explanation: |
  round() can take a second number — how many digits to keep after the decimal point.

  round(3.14159 * 2, 2) multiplies first, then rounds the answer to 2 decimal places instead of a whole number.
example_code: |
  print(round(3.14159 * 2, 2))
starter_code: |
  print(round(3.14159 * 2, 2))
challenge: |
  🎯 Challenge: Multiply 2.71828 by 3, then round the result to 3 decimal places.
expected_output: "8.155"
hints:
  - "Change the numbers to 2.71828, 3, and the digit count to 3."
  - "The second number inside round() controls how many digits are kept."
  - "It should look like: print(round(2.71828 * 3, 3))"
