id: course_concurrency_concurrencyasync_1
title: "What is Concurrency? ⚡"
level: 981
objective: "Understand that concurrency means multiple tasks make progress by taking turns, simulated with interleaved output."
explanation: |
  Concurrency means multiple tasks make progress over the same period of time, by taking turns, instead of one finishing completely before the next starts.

  We can simulate "taking turns" with a loop that interleaves steps from two tasks, one step at a time.
example_code: |
  task_a = ["A1", "A2", "A3"]
  task_b = ["B1", "B2", "B3"]
  for a, b in zip(task_a, task_b):
      print(a)
      print(b)
starter_code: |
