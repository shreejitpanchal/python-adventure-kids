id: lesson_646
title: "Ask a Question: Level 27 🙋"
level: 646
objective: "Split a typed sentence into words and print just the first one."
explanation: |
  .split() breaks a typed sentence into a list of words, and you can grab just one of them with indexing.

  sentence = input("Type a short sentence: ") stores what you typed. print(sentence.split()[0]) shows only the first word.
example_code: |
  sentence = input("Type a short sentence: ")
  print(sentence.split()[0])
starter_code: |
  sentence = input("Type a short sentence: ")
  print(sentence.split()[0])
challenge: |
  🎯 Challenge: Type "a quick brown fox" in the box below, then press RUN to see just the first word!
expected_output: "Type a short sentence: a"
input_prompt: "Type a short sentence:"
hints:
  - "Type a quick brown fox in the answer box above the RUN button."
  - ".split() breaks the sentence into a list of words, and [0] grabs the first one."
  - "You don't need to change the code — just type a quick brown fox and press RUN!"
