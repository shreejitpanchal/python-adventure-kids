id: lesson_646
title: "Ask a Question: Level 27 🙋"
level: 646
objective: "Work out a discounted price from a typed price."
explanation: |
  You can do more than one operation in the same line of math — price * 0.1 works out 10% of the price, and subtracting that gives the discounted total.

  price = float(input("What is the price? ")) stores your price. print(price - price * 0.1) takes 10% off.
example_code: |
  price = float(input("What is the price? "))
  print(price - price * 0.1)
starter_code: |
  price = float(input("What is the price? "))
  print(price - price * 0.1)
challenge: |
  🎯 Challenge: Type the price 20 in the box below, then press RUN to see it with 10% off!
expected_output: "What is the price? 18.0"
input_prompt: "What is the price?"
hints:
  - "Type 20 in the answer box above the RUN button."
  - "price * 0.1 works out 10% of the price, then it's subtracted from the total."
  - "You don't need to change the code — just type 20 and press RUN!"
