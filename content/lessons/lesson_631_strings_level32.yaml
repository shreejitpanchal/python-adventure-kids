id: lesson_631
title: "Strings: Level 32 🔤"
level: 631
objective: "Use several expressions inside one f-string, including a calculation."
explanation: |
  An f-string can hold as many {} expressions as you like, all in the same line of text.

  f"{a}-{b}-{c} sum={a + b + c}" drops in three variables AND a calculated sum, all inside one string.
example_code: |
  a = 4
  b = 5
  c = 6
  print(f"{a}-{b}-{c} sum={a + b + c}")
starter_code: |
  a = 4
  b = 5
  c = 6
  print(f"{a}-{b}-{c} sum={a + b + c}")
challenge: |
  🎯 Challenge: Change a to 3, b to 4, and c to 5, keeping the same f-string.
expected_output: "3-4-5 sum=12"
hints:
  - "Just change the numbers stored in a, b, and c — the f-string itself doesn't need to change."
  - "{a + b + c} recalculates automatically once a, b, and c are different."
  - "It should look like: a = 3, b = 4, c = 5, print(f\"{a}-{b}-{c} sum={a + b + c}\")"
