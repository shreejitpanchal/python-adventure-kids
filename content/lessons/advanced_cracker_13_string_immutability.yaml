id: advanced_cracker_13
title: "Advanced Code Cracker: The Uncensored Word 🕵️"
level: 488
objective: "Fix a TypeError caused by trying to assign to a character index of a string, which Python's immutable strings don't support."
explanation: |
  Strings in Python are immutable -- there's no such thing as changing one
  character of an existing string object in place. `word[0] = "*"` isn't
  slow or discouraged, it's simply not a legal operation, and raises
  `TypeError: 'str' object does not support item assignment`.

  Any "edit" of a string has to build a NEW string instead, typically by
  slicing out the parts you want to keep and concatenating in the
  replacement, or by using `"".join(...)` over a list of characters.
example_code: |
  def censor_first_letter(word):
      return "*" + word[1:]


  print(censor_first_letter("secret"))
starter_code: |
  def censor_first_letter(word):
      word[0] = "*"
      return word


  print(censor_first_letter("secret"))
challenge: |
  🎯 This crashes with a TypeError before it ever gets to return anything.
  Strings can't be edited in place -- rewrite censor_first_letter to build
  a new string instead.
expected_output: "*ecret"
ast_contains: ["def", "return", "print"]
hints:
  - "word[0] = \"*\" tries to modify the string object itself -- strings don't support that."
  - "You need a brand new string, not an in-place edit of the old one."
  - "Build it with slicing and concatenation: \"*\" + word[1:] keeps everything from index 1 onward and prepends a replacement first character."
