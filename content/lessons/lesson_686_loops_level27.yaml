id: lesson_686
title: "Loops: Level 27 🔁"
level: 686
objective: "Combine two conditions with 'and' while searching for the first match."
explanation: |
  and lets a condition check two things at once -- both have to be true for the whole condition to be true. i % 4 == 0 and i % 6 == 0 only matches numbers divisible by BOTH 4 and 6.

  The search-and-break pattern still works exactly the same way -- it just stops on a stricter match this time.
example_code: |
  for i in range(1, 100):
      if i % 4 == 0 and i % 6 == 0:
          print(i)
          break
starter_code: |
  for i in range(1, 100):
      if i % 4 == 0 and i % 6 == 0:
          print(i)
          break
challenge: |
  🎯 Challenge: Can you find the first number divisible by both 3 and 5 instead?
expected_output: "15"
hints:
  - "Change i % 4 == 0 and i % 6 == 0 to i % 3 == 0 and i % 5 == 0."
  - "and needs BOTH sides to be true -- the number has to divide evenly by 3 AND by 5."
  - "The first number divisible by both 3 and 5 is 15."
