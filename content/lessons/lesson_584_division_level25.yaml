id: lesson_584
title: "Division: Level 25 ➗"
level: 584
objective: "Round a division result to a specific number of decimal digits."
explanation: |
  round() can take a second number — how many digits to keep after the decimal point.

  round(22 / 7, 2) divides first, then rounds the answer to 2 decimal places instead of a whole number.
example_code: |
  print(round(22 / 7, 2))
starter_code: |
  print(round(22 / 7, 2))
challenge: |
  🎯 Challenge: Divide 10 by 3, then round the result to 3 decimal places.
expected_output: "3.333"
hints:
  - "Change the numbers to 10, 3, and the digit count to 3."
  - "The second number inside round() controls how many digits are kept."
  - "It should look like: print(round(10 / 3, 3))"
