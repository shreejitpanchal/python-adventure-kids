challenge: |
  🎯 Challenge: Can you change the range to count from 1 to 8 instead of 1 to 5?
expected_output: "1, 2, 3, 4, 5, 6, 7, 8"
hints:
  - "Change range(1, 6) to range(1, 9)."
  - "The if check and the rest of the loop already work for any range -- only the numbers change."
  - "The output should list every number from 1 to 8, separated by \", \" with no trailing comma."
