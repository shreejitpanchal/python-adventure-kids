id: lesson_694
title: "Loops: Level 35 🔁"
level: 694
objective: "Build a comma-separated string in a loop without a trailing separator."
explanation: |
  When you glue items together by hand, it's easy to end up with an extra separator at the very end. Checking if result != "" before adding the separator skips it on the very first item, so every separator lands only BETWEEN items.

  That's the same trick .join(...) does automatically behind the scenes -- this builds it manually, one piece at a time.
example_code: |
  numbers = range(1, 6)
  result = ""
  for n in numbers:
      if result != "":
          result = result + ", "
      result = result + str(n)
  print(result)
starter_code: |
