id: lesson_708
title: "Functions: Level 29 ⚙️"
level: 708
objective: "Write a small recursive function that calls itself with a smaller number until it reaches a stopping point."
explanation: |
  A function can call ITSELF -- this is called recursion. It needs a base case that stops the calling (n <= 0 here), or it would call itself forever.

  countdown(n) prints n, then calls countdown(n - 1) on a smaller number. Each call is a little closer to the base case, so the chain of calls is guaranteed to end.
example_code: |
  def countdown(n):
      if n <= 0:
          print("Liftoff!")
      else:
          print(n)
          countdown(n - 1)

  countdown(3)
starter_code: |
  def countdown(n):
      if n <= 0:
          print("Liftoff!")
      else:
          print(n)
          countdown(n - 1)

