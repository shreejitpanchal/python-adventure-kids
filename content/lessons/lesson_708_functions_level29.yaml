challenge: |
  🎯 Challenge: Can you call countdown with 5 instead of 3, so it counts down from 5?
expected_output: |
  5
  4
  3
  2
  1
  Liftoff!
hints:
  - "Change the number you pass into countdown(...)."
  - "countdown(5) prints 5, then calls countdown(4), then countdown(3), and so on down to 0."
  - "It should look like: countdown(5)"
