id: course_advanced_concepts_functionalprogramming_2
title: "Your Sample Program with Functional Programming 🧬"
level: 967
objective: "Combine filter() and functools.reduce() to filter and combine a list."
explanation: |
  filter() keeps only the items where a function returns True. functools.reduce() then combines all the remaining items into one result, one step at a time.
example_code: |
  from functools import reduce
  numbers = [1, 2, 3, 4, 5, 6]
  evens = list(filter(lambda x: x % 2 == 0, numbers))
  total = reduce(lambda a, b: a + b, evens)
  print(evens)
  print(total)
starter_code: |
