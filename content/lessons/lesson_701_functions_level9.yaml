id: lesson_701
title: "Functions: Level 22 ⚙️"
level: 701
objective: "Override a default parameter and use the ** exponent operator."
explanation: |
  ** is Python's exponent operator -- base ** exponent means "base raised to the power of exponent". Combined with a default parameter, power(base, exponent=2) squares a number unless you tell it to do something else.

  Passing in a second argument overrides the default, just like with any other default parameter.
example_code: |
  def power(base, exponent=2):
      return base ** exponent

  print(power(5))
starter_code: |
  def power(base, exponent=2):
      return base ** exponent

  print(power(5))
challenge: |
  🎯 Challenge: Can you call power with base 2 and exponent 5 instead, so it prints 32?
expected_output: "32"
hints:
  - "Call power(2, 5) instead of power(5)."
  - "Passing a second value overrides the default exponent of 2."
  - "2 ** 5 means 2 x 2 x 2 x 2 x 2, which is 32."
