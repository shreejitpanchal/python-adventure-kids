id: lesson_411
title: "Lists: Level 13 🎒"
level: 411
objective: "Sort a list into order with sorted(...)."
explanation: |
  sorted(...) hands back a NEW list with the items arranged from smallest to largest (or alphabetically, for words) — it doesn't change the original list.

  sorted([9, 3, 7, 1]) looks at every number and lines them up in order: 1, 3, 7, 9.
example_code: |
  numbers = [9, 3, 7, 1]
  print(sorted(numbers))
starter_code: |
  numbers = [9, 3, 7, 1]
  print(sorted(numbers))
challenge: |
  🎯 Challenge: Can you change the backpack to [42, 7, 19, 3, 88] and print it sorted from smallest to largest?
expected_output: "[3, 7, 19, 42, 88]"
hints:
  - "Change numbers = [...] to the new list of five numbers."
  - "sorted(...) doesn't need to change — it still puts the items in order."
  - "It should look like: numbers = [42, 7, 19, 3, 88], then print(sorted(numbers))"
