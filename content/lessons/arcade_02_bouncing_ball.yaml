id: arcade_02
title: "Arcade Lab: Bouncing Ball 🎾"
level: 261
objective: "Use game.after() and a changing variable to bounce the ball off the side walls."
explanation: |
  To make the ball move sideways forever, we give it a speed called dx (change in x) and
  move it a little every tick, just like the Snake project.

  To bounce, we check where the ball is: if it's touching the left or right edge of the
  360-pixel-wide screen, we flip dx from positive to negative (or back). Since move_ball()
  needs to change dx -- a variable created outside the function -- it needs the line
  "global dx" first, so Python knows to update the outside variable instead of making a new one.
example_code: |
  game.set_background("black")
  ball = game.draw_circle(180, 140, 8, "yellow")
  dx = 4

  def move_ball():
      global dx
      x, y = game.get_shape_position(ball)
      if x <= 8 or x >= 352:
          dx = -dx
      game.move_shape(ball, dx, 0)
      game.after(30, move_ball)

  move_ball()
