challenge: |
  🎯 Challenge: Press RUN and watch the ball bounce side to side forever! Try changing
  dx = 4 to a bigger number to speed it up.
expected_output: ""
ast_contains: ["after", "global"]
hints:
  - "x <= 8 means the ball's left edge (x minus its radius) has hit the wall."
  - "global dx lets move_ball() change the dx that was created outside the function."
  - "game.after(30, move_ball) calling itself is what keeps the ball moving -- no while loop needed."
