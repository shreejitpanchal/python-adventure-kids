id: course_advanced_concepts_recursion_2
title: "Your Sample Program with Recursion 🪆"
level: 964
objective: "Write a recursive function that adds up all the numbers in a list."
explanation: |
  This function adds up a list recursively: the sum of a list is its first item, plus the sum of everything after it. The base case is an empty list, which sums to 0.
example_code: |
  def sum_list(numbers):
      if len(numbers) == 0:
          return 0
      return numbers[0] + sum_list(numbers[1:])

  print(sum_list([1, 2, 3, 4]))
