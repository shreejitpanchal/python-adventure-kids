id: lesson_61
title: "Numbers: Level 17 🔢"
level: 61
objective: "Find the absolute value of a decimal number."
explanation: |
  abs() works on decimals too, not just whole numbers.

  abs(-3.5) is 3.5, because -3.5 is 3.5 steps away from zero.
example_code: |
  print(abs(-3.5))
starter_code: |
  print(abs(-3.5))
challenge: |
  🎯 Challenge: Can you make Python print the absolute value of -12.25?
expected_output: "12.25"
hints:
  - "Change -3.5 to -12.25."
  - "It should look like: print(abs(-12.25))"
