id: lesson_538
title: "Addition: Level 39 ➕"
level: 538
objective: "Convert two pieces of text into numbers, then add them along with a plain number."
explanation: |
  You can use int() more than once in the same line -- Python converts each piece of text separately, then adds everything.

  int("10") + int("5") + 3 converts both pieces of text to numbers, then adds all three together: 18.
example_code: |
  print(int("10") + int("5") + 3)
starter_code: |
  print(int("10") + int("5") + 3)
challenge: |
  🎯 Challenge: Convert the text "22" and "8" into numbers, then add 7 to the total.
expected_output: "37"
hints:
  - "Change \"10\" to \"22\", \"5\" to \"8\", and 3 to 7."
  - "Each int(...) converts its own piece of text before the adding happens."
  - "It should look like: print(int(\"22\") + int(\"8\") + 7)"
