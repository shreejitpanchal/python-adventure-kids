id: lesson_644
title: "Ask a Question: Level 25 🙋"
level: 644
objective: "Grab the first and last letter of a typed word using indexing."
explanation: |
  word[0] grabs the first letter, and word[-1] grabs the last letter — you can join them together with +.

  word = input("Type a word: ") stores your word. print(word[0] + word[-1]) glues its first and last letters together.
example_code: |
  word = input("Type a word: ")
  print(word[0] + word[-1])
starter_code: |
  word = input("Type a word: ")
  print(word[0] + word[-1])
challenge: |
  🎯 Challenge: Type the word python in the box below, then press RUN to see its first and last letters!
expected_output: "Type a word: pn"
input_prompt: "Type a word:"
hints:
  - "Type python in the answer box above the RUN button."
  - "word[0] is the first letter, word[-1] is the last letter, and + glues them together."
  - "You don't need to change the code — just type python and press RUN!"
