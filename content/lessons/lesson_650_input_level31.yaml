id: lesson_650
title: "Ask a Question: Level 31 🙋"
level: 650
objective: "Split a typed full name into first and last, and greet both with an f-string."
explanation: |
  You can split any typed line into pieces, not just numbers — including a full name.

  parts = line.split() breaks your typed name into two pieces at the space. print(f"Hello {parts[0]} {parts[1]}!") uses both pieces in the greeting.
example_code: |
  line = input("Type your first and last name separated by a space: ")
  parts = line.split()
  print(f"Hello {parts[0]} {parts[1]}!")
starter_code: |
  line = input("Type your first and last name separated by a space: ")
  parts = line.split()
  print(f"Hello {parts[0]} {parts[1]}!")
challenge: |
  🎯 Challenge: Type your first and last name (try Maya Rivera), separated by a space, then press RUN!
expected_output: "Type your first and last name separated by a space: Hello {input}!"
input_prompt: "Type your first and last name separated by a space:"
hints:
  - "Type your first and last name, like Maya Rivera, with a space between them."
  - "parts[0] is your first name and parts[1] is your last name."
  - "You don't need to change the code — just type a first and last name and press RUN!"
