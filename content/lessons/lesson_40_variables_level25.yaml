id: lesson_40
title: "Variables: Level 13 📦"
level: 40
objective: "Store the result of a function call in a variable."
explanation: |
  A variable can hold the answer a function gives back, not just plain numbers or text.

  biggest = max(4, 9) runs max(4, 9) first, then stores its answer (9) inside biggest.
example_code: |
  biggest = max(4, 9)
  print(biggest)
starter_code: |
  biggest = max(4, 9)
  print(biggest)
challenge: |
  🎯 Challenge: Store the smaller of 15 and 6 in a variable called smallest. Print it.
expected_output: "6"
hints:
  - "Use min(15, 6) instead of max(...)."
  - "It should look like: smallest = min(15, 6), print(smallest)"
