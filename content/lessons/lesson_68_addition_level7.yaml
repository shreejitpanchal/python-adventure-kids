objective: "Add two decimals, then round the answer."
explanation: |
  You can combine skills — add first, then round the result to a whole number.

  round(3.2 + 4.7) adds first (getting 7.9), then rounds that to 8.
example_code: |
  print(round(3.2 + 4.7))
