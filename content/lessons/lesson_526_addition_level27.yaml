id: lesson_526
title: "Addition: Level 27 ➕"
level: 526
objective: "Combine an f-string with round() to show a tidy addition result."
explanation: |
  You can put round() inside an f-string's curly braces, right along with the addition.

  f"Sum: {round(3.2 + 4.7)}" adds first (getting 7.9), then rounds it to 8, inside the sentence.
example_code: |
  print(f"Sum: {round(3.2 + 4.7)}")
starter_code: |
  print(f"Sum: {round(3.2 + 4.7)}")
challenge: |
  🎯 Challenge: Can you show "Sum: " followed by the rounded result of 5.6 + 3.1?
expected_output: "Sum: 9"
hints:
  - "Change 3.2 + 4.7 to 5.6 + 3.1, inside round(...)."
  - "round() runs first, then the f-string shows the result."
  - "It should look like: print(f\"Sum: {round(5.6 + 3.1)}\")"
