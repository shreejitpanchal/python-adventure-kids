id: lesson_676
title: "Decisions: Level 37 🚦"
level: 676
objective: "Combine two direct boolean variables with and to gate a decision."
explanation: |
  Just like a single boolean can be checked directly, two booleans can be combined with and, with no == True needed anywhere.

  if has_key and has_map: is only true when BOTH variables are True.
example_code: |
  has_key = True
  has_map = False
  if has_key and has_map:
      print("You can enter the treasure room!")
  else:
      print("You're missing something to get in.")
starter_code: |
