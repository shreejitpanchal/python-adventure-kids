id: lesson_578
title: "Multiplication: Level 39 ✖️"
level: 578
objective: "Use // and % on the result of a three-number multiplication chain."
explanation: |
  Python multiplies all three numbers first, then works out how many whole times the last number fits in, and what's left over.
example_code: |
  print((2 * 3 * 4) // 5, (2 * 3 * 4) % 5)
starter_code: |
  print((2 * 3 * 4) // 5, (2 * 3 * 4) % 5)
challenge: |
  🎯 Challenge: Multiply 3, 4, and 5 together, then print how many whole times 7 fits into the result, and the remainder.
expected_output: "8 4"
hints:
  - "Change the chain to 3 * 4 * 5, and divide by 7 in both places."
  - "It should look like: print((3 * 4 * 5) // 7, (3 * 4 * 5) % 7)"
