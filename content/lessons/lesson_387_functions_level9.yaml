          print("It's not too hot.")

  check_temp(20)
challenge: |
  🎯 Challenge: Can you call check_temp with 35 instead of 20, so it prints "It's hot!"?
expected_output: "It's hot!"
hints:
  - "Change the number you pass into check_temp(...)."
  - "It needs to be bigger than 30 to trigger the \"hot\" message."
  - "It should look like: check_temp(35)"
