id: lesson_387
title: "Functions: Level 9 ⚙️"
level: 387
objective: "Put an if/else inside a function's body."
explanation: |
  A function can make decisions too. Put an if/else inside its body, and the function will choose what to do differently depending on the parameter it was given.

  check_temp(temp) checks whether temp is above 30 and prints a different message depending on the answer.
example_code: |
  def check_temp(temp):
      if temp > 30:
          print("It's hot!")
      else:
          print("It's not too hot.")

  check_temp(20)
starter_code: |
  def check_temp(temp):
      if temp > 30:
          print("It's hot!")
