objective: "Practice using max() to find the bigger of two numbers."
explanation: |
  Let's practice max() again — it hands you back whichever number is bigger.

  max(6, 15) is 15, because 15 is the bigger of the two.
example_code: |
  print(max(6, 15))
starter_code: |
  print(max(6, 15))
