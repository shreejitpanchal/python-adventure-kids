id: rpg_08
title: "RPG Quest: The Final Inventory Check ⚔️"
level: 247
objective: "Combine append, a loop, and len() to build and report a full inventory."
explanation: |
  A real quest log does everything at once: add the items you found,
  list them all out, and report how many you're carrying -- combining
  everything this track has taught so far.
example_code: |
  inventory = ["map", "potion"]
  inventory.append("shield")
  inventory.append("torch")
  for item in inventory:
      print(item)
  print("Total items:", len(inventory))
starter_code: |
  inventory = ["map", "potion"]
  for item in inventory:
      print(item)
  print("Total items:", len(inventory))
challenge: |
  🎯 Your explorer found a shield and a torch on this quest! Add them to
  the inventory before the loop reports everything.
expected_output: "map\npotion\nshield\ntorch\nTotal items: 4"
ast_contains: ["inventory.append", "for", "len"]
hints:
  - "Use two inventory.append(...) calls to add the shield and torch."
  - "Add them before the for loop, so they show up in the printed list."
  - "It should look like:\ninventory.append(\"shield\")\ninventory.append(\"torch\")"
