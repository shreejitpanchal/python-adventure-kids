id: lesson_702
title: "Functions: Level 23 ⚙️"
level: 702
objective: "Return more than one value from a function as a tuple and unpack it."
explanation: |
  A function can return more than one value at once, separated by a comma -- Python bundles them into a tuple automatically. return parts[0], parts[1] hands back two values in one go.

  first, last = split_name(...) unpacks both values straight into two separate variables in a single line.
example_code: |
  def split_name(full_name):
      parts = full_name.split(" ")
      return parts[0], parts[1]

  first, last = split_name("Ada Lovelace")
  print(first)
  print(last)
starter_code: |
  def split_name(full_name):
      parts = full_name.split(" ")
