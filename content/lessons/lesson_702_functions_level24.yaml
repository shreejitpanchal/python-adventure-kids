  first, last = split_name("Ada Lovelace")
  print(first)
  print(last)
challenge: |
  🎯 Challenge: Can you call split_name with "Grace Hopper" instead, so it prints Grace then Hopper?
expected_output: |
  Grace
  Hopper
hints:
  - "Change the text you pass into split_name(...)."
  - ".split(\" \") breaks the full name into two pieces wherever there's a space."
  - "It should look like: split_name(\"Grace Hopper\")"
