id: lesson_718
title: "Functions: Level 39 ⚙️"
level: 718
objective: "Combine a default parameter with a conditional return in one function."
explanation: |
  A default parameter and a conditional return can work together — the discount only applies when a condition is met.

  apply_discount(price, discount=10) only subtracts the discount if price is over 50; otherwise it hands the price back unchanged.
example_code: |
  def apply_discount(price, discount=10):
      if price > 50:
          return price - discount
      return price

  print(apply_discount(80))
  print(apply_discount(30))
starter_code: |
  def apply_discount(price, discount=10):
      if price > 50:
          return price - discount
      return price

  print(apply_discount(80))
  print(apply_discount(30))
challenge: |
  🎯 Challenge: Can you call apply_discount with 60, then with 40, instead?
expected_output: |
  50
  40
hints:
  - "Change the two calls to apply_discount(60) and apply_discount(40)."
  - "60 is over 50, so 10 gets subtracted: 60 - 10 = 50. 40 is not over 50, so it stays 40."
