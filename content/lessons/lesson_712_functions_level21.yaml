id: lesson_712
title: "Functions: Level 33 ⚙️"
level: 712
objective: "Override a default parameter on a function that builds a string with a loop."
explanation: |
  Default parameters work just as well with loop-building functions as they do with simple ones. repeat_word(word, times=3) repeats a word 3 times unless you tell it a different number.

  .strip() at the end trims off the extra space left over from the loop, so the final result doesn't have a trailing gap.
example_code: |
  def repeat_word(word, times=3):
      result = ""
      for i in range(times):
          result += word + " "
      return result.strip()

  print(repeat_word("Go"))
starter_code: |
