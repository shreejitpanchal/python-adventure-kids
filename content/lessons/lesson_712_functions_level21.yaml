challenge: |
  🎯 Challenge: Can you call repeat_word with "Go" and 5 instead, so it prints "Go Go Go Go Go"?
expected_output: "Go Go Go Go Go"
hints:
  - "Call repeat_word(\"Go\", 5) instead of repeat_word(\"Go\")."
  - "Passing a second value overrides the default of 3."
  - "It should look like: print(repeat_word(\"Go\", 5))"
