id: lesson_392
title: "Functions: Level 14 ⚙️"
level: 392
objective: "Call the same function multiple times and print each result."
explanation: |
  The whole point of building a function once is being able to call it over and over. Each call is independent -- triple(2) and triple(5) don't interfere with each other at all.

  Add another call and another print, and you get a third answer for free, without rewriting the function.
example_code: |
  def triple(n):
      return n * 3

  print(triple(2))
  print(triple(5))
starter_code: |
  def triple(n):
      return n * 3

  print(triple(2))
  print(triple(5))
challenge: |
  🎯 Challenge: Can you add one more line that calls triple(10) and prints it, so the output has three lines: 6, then 15, then 30?
expected_output: |
  6
  15
  30
hints:
  - "Add a third print(triple(...)) line underneath the other two."
  - "Pass 10 into triple this time."
  - "It should look like: print(triple(10))"
