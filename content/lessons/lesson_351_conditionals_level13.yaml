id: lesson_351
title: "Decisions: Level 13 🚦"
level: 351
objective: "Compare two converted numbers against each other."
explanation: |
  When both answers start out as text, you convert both with int() before comparing them — just like you'd compare two ordinary numbers.

  first_num > second_num, second_num > first_num, and the else together cover every possibility: first is bigger, second is bigger, or they're equal.
example_code: |
  first_text = "8"
  second_text = "15"
  first_num = int(first_text)
  second_num = int(second_text)
  if first_num > second_num:
      print("The first number is bigger!")
  elif second_num > first_num:
      print("The second number is bigger!")
  else:
      print("They are equal!")
