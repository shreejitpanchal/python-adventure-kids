id: course_functions_2
title: "Your Sample Program with Functions 🧰"
level: 910
objective: "Call the same function more than once to see it run repeatedly."
explanation: |
  The real power of a function is reusing it -- build it once, then call it as many times as you like.
example_code: |
  def greet():
      print("Hello!")

  greet()
  greet()
starter_code: |
  def greet():
      print("Hello!")

  greet()
  greet()
challenge: |
  🎯 Challenge: Add a third greet() call, then run it.
expected_output: |
  Hello!
  Hello!
  Hello!
hints:
  - "Add one more line: greet()"
  - "Put it after the two greet() calls that are already there."
  - "Don't change anything inside the function itself."
