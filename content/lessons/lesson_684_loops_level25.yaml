      for col in range(size):
          if row == 0 or row == size - 1 or col == 0 or col == size - 1:
              line = line + "*"
          else:
              line = line + " "
      print(line)
challenge: |
  🎯 Challenge: Can you make the box size 4 instead of 5?
expected_output: |
  ****
  *  *
  *  *
  ****
hints:
  - "Change size = 5 to size = 4."
  - "The if/else logic doesn't need to change at all -- it already works for any size."
  - "A smaller box just means fewer rows and fewer columns get drawn."
