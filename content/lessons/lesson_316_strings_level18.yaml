id: lesson_316
title: "Strings: Level 18 🔤"
level: 316
objective: "Capitalize each word in a string using .title()."
explanation: |
  phrase.title() capitalizes the first letter of every word in the string, and lowercases the rest.

  "hello world".title() turns into "Hello World" — handy for turning messy titles into neat ones.
example_code: |
  phrase = "hello world"
  print(phrase.title())
starter_code: |
  phrase = "hello world"
  print(phrase.title())
challenge: |
  🎯 Challenge: Change phrase to "the lost city" and print its title-cased version.
expected_output: "The Lost City"
hints:
  - "Change \"hello world\" to \"the lost city\", keeping the quotes."
  - ".title() capitalizes every single word, not just the first one."
  - "It should look like: phrase = \"the lost city\", print(phrase.title())"
