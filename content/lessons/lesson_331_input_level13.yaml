id: lesson_331
title: "Ask a Question: Level 13 🙋"
level: 331
objective: "Use len() to count the letters in a typed word."
explanation: |
  len(...) counts how many characters are inside a piece of text — letters, spaces, everything.

  word = input("Type a word: ") stores your word. print(len(word)) counts how many letters are in it.
example_code: |
  word = input("Type a word: ")
  print(len(word))
starter_code: |
  word = input("Type a word: ")
  print(len(word))
challenge: |
  🎯 Challenge: Type the word python in the box below, then press RUN to see how many letters it has!
expected_output: "Type a word: 6"
input_prompt: "Type a word:"
hints:
  - "Type python in the answer box above the RUN button."
  - "len(...) counts the letters in whatever text you give it."
  - "You don't need to change the code — just type python and press RUN!"
