id: lesson_739
title: "Lists: Level 40 🎒"
level: 739
objective: "Capstone: combine a list of nested pairs, a nested loop, an accumulator, and a function to compute a class average."
explanation: |
  This final lists challenge combines everything from the whole extended track: a list holding structured data (each item pairs a name with a list of scores), a nested loop to reach every number, an accumulator, and a function that returns the result.

  class_average(students) walks through every student's scores, adding each one into total and counting them in count, then returns the overall average once every score has been visited.
example_code: |
  def class_average(students):
      total = 0
      count = 0
      for name, scores in students:
          for s in scores:
              total += s
              count += 1
      return total / count

  students = [("Ana", [80, 90]), ("Ben", [70, 60, 100])]
  print(class_average(students))
starter_code: |
