challenge: |
  🎯 Challenge: Can you add a third student, ("Cara", [90, 90, 90, 90, 90]), to the students list and print the new class average?
expected_output: "85.0"
hints:
  - "Add a third tuple inside the students list: (\"Cara\", [90, 90, 90, 90, 90])."
  - "The function itself doesn't need to change -- it already loops through however many students are in the list."
  - "With Cara added, the total becomes 850 across 10 scores, so the average is 85.0."
