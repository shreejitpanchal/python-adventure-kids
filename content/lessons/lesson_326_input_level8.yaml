id: lesson_326
title: "Ask a Question: Level 8 🙋"
level: 326
objective: "Ask for an age and print the age next year."
explanation: |
  You can use input() to ask about real things, like someone's age!

  age = int(input("How old are you? ")) stores your age as a number. print(age + 1) shows how old you'll be next year.
example_code: |
  age = int(input("How old are you? "))
  print(age + 1)
starter_code: |
  age = int(input("How old are you? "))
  print(age + 1)
challenge: |
  🎯 Challenge: Type the age 9 in the box below, then press RUN to see next year's age!
expected_output: "How old are you? 10"
input_prompt: "How old are you?"
hints:
  - "Type 9 in the answer box above the RUN button."
  - "Adding 1 to an age tells you how old you'll be next year."
  - "You don't need to change the code — just type 9 and press RUN!"
