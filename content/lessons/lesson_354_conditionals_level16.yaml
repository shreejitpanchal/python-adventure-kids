id: lesson_354
title: "Decisions: Level 16 🚦"
level: 354
objective: "Use in to check whether a letter appears inside a word."
explanation: |
  in checks whether one piece of text appears somewhere inside another piece of text.

  if "z" in word: is true only when the letter z shows up anywhere inside word — at the start, middle, or end.
example_code: |
  word = "python"
  if "z" in word:
      print("Found the letter!")
  else:
      print("Letter not found.")
starter_code: |
  word = "python"
  if "z" in word:
      print("Found the letter!")
  else:
      print("Letter not found.")
challenge: |
  🎯 Challenge: Change word so Python prints "Found the letter!" instead.
expected_output: "Found the letter!"
hints:
