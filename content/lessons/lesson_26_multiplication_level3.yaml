id: lesson_26
title: "Multiplication: Level 3 ✖️"
level: 26
objective: "Multiply three numbers together in one line."
explanation: |
  Just like addition, you can chain multiplication too.

  print(2 * 2 * 2) multiplies all three numbers together, left to right.
example_code: |
  print(2 * 2 * 2)
starter_code: |
  print(2 * 2 * 2)
challenge: |
  🎯 Challenge: Can you make Python multiply 2, 3, and 4 all together?
expected_output: "24"
hints:
  - "Use * between all three numbers, like print(2 * 3 * 4)."
  - "It should look like: print(2 * 3 * 4)"
