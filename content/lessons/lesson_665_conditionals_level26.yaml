challenge: |
  🎯 Challenge: Change age so Python prints "Enjoy the family movie!" instead.
expected_output: "Enjoy the family movie!"
hints:
  - "has_ticket is already \"yes\", so look at the inner elif chain."
  - "The family movie branch needs age to be 6 or more, but less than 13."
  - "Try age = 8."
