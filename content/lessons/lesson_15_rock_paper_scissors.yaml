id: lesson_15
title: "Rock, Paper, Scissors ✂️"
level: 15
objective: "Use functions, random choice, and multiple conditions to build a classic game."
explanation: |
  Let's build Rock, Paper, Scissors! The computer needs to pick randomly, so we use random.choice(...) with a list of options.

  get_computer_choice() is a function — a little machine that returns the computer's pick.

  Then a chain of if / elif / else checks compares your choice to the computer's to decide who wins.
example_code: |
  import random

  def get_computer_choice():
      return random.choice(["rock", "paper", "scissors"])

  player = input("Rock, paper, or scissors? ")
  computer = get_computer_choice()

  if player == computer:
      print("It's a tie!")
  elif player == "rock" and computer == "scissors":
      print("You win!")
  elif player == "paper" and computer == "rock":
      print("You win!")
  elif player == "scissors" and computer == "paper":
      print("You win!")
  else:
      print("Computer wins!")
