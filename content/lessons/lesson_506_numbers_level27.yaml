id: lesson_506
title: "Numbers: Level 27 🔢"
level: 506
objective: "Use % and == together to check if a number divides evenly into another."
explanation: |
  When % gives 0, that means the division was exact -- nothing left over.

  12 % 4 == 0 is True, because 4 goes into 12 exactly 3 times with nothing left.
example_code: |
  print(12 % 4 == 0)
starter_code: |
  print(12 % 4 == 0)
challenge: |
  🎯 Challenge: Can you make Python check if 17 divides evenly by 5?
expected_output: "False"
hints:
  - "Change the numbers to 17 and 5."
  - "If the remainder isn't 0, the division wasn't even."
  - "It should look like: print(17 % 5 == 0)"
