id: lesson_727
title: "Lists: Level 28 🎒"
level: 727
objective: "Store a list of lists and index into it two levels deep."
explanation: |
  A list can hold OTHER lists inside it -- this is called a nested list, like a backpack full of smaller pouches. grid[1] grabs the second pouch, and grid[1][0] reaches inside that pouch to grab its first item.

  Each pair of brackets goes one level deeper: the first picks which inner list, the second picks which item inside it.
example_code: |
  grid = [[1, 2], [3, 4], [5, 6]]
  print(grid[1][0])
starter_code: |
  grid = [[1, 2], [3, 4], [5, 6]]
  print(grid[1][0])
challenge: |
  🎯 Challenge: Can you print the item at grid[2][1] instead?
expected_output: "6"
hints:
  - "Change grid[1][0] to grid[2][1]."
  - "grid[2] is the third inner list, [5, 6], and [1] grabs its second item."
  - "It should look like: print(grid[2][1])"
