id: lesson_44
title: "Variables: Level 17 📦"
level: 44
objective: "Store a decimal number in a variable and round it when printing."
explanation: |
  round(temp) works on a variable just like it works on a plain number — it rounds whatever value is stored inside.
example_code: |
  temp = 98.6
  print(round(temp))
starter_code: |
  temp = 98.6
  print(round(temp))
challenge: |
  🎯 Challenge: Store 12.3 in a variable called weight, and print it rounded.
expected_output: "12"
hints:
  - "Change temp to weight = 12.3, then print(round(weight))."
  - "It should look like: weight = 12.3, print(round(weight))"
