id: ai_tools_whatismcp_1
title: "What is MCP? 🔌"
level: 2013
objective: "Understand MCP as a shared request format letting an AI assistant ask other tool programs for help."
explanation: |
  MCP (Model Context Protocol) is a shared "menu format" that lets an AI assistant ask other tool programs for help -- like ordering at a restaurant: the AI is the customer, MCP is the standard menu format, and the tool is the kitchen that fulfills the order.

  Here, request is the AI's order (which tool, with what details), and get_weather() is the "kitchen" that fulfills it.
example_code: |
  def get_weather(city):
      return "Sunny in " + city

  request = {"tool": "get_weather", "city": "Paris"}
  print("The AI is asking for tool: " + request["tool"])
  result = get_weather(request["city"])
  print("The tool replied: " + result)
starter_code: |
