challenge: |
  🎯 Challenge: Change request's "city" to "Tokyo", then run it.
expected_output: |
  The AI is asking for tool: get_weather
  The tool replied: Sunny in Tokyo
hints:
  - "Change \"Paris\" to \"Tokyo\" inside the request dictionary."
  - "get_weather() is called with whatever city is inside request."
  - "It should look like: request = {\"tool\": \"get_weather\", \"city\": \"Tokyo\"}"
