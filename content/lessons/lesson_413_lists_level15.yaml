id: lesson_413
title: "Lists: Level 15 🎒"
level: 413
objective: "Check whether an item is in a list using the in keyword."
explanation: |
  The in keyword asks a yes-or-no question: is this item somewhere inside the list? "banana" in fruits gives back True or False.

  Combined with if, you can make decisions based on what's packed in the backpack — without needing to know exactly where it is.
example_code: |
  fruits = ["apple", "banana", "orange"]
  if "banana" in fruits:
      print("Found it!")
  else:
      print("Not found.")
starter_code: |
  fruits = ["apple", "banana", "orange"]
  if "banana" in fruits:
      print("Found it!")
  else:
      print("Not found.")
challenge: |
  🎯 Challenge: Can you change the backpack to ["mango", "kiwi", "pear"] and check whether "banana" is packed inside it?
expected_output: "Not found."
hints:
  - "Change fruits = [...] to the new list of three fruits — \"banana\" isn't one of them."
  - "The in keyword still checks whether an item is inside a list: if \"banana\" in fruits:"
  - "It should look like: fruits = [\"mango\", \"kiwi\", \"pear\"], then if \"banana\" in fruits: print(\"Found it!\") else: print(\"Not found.\")"
