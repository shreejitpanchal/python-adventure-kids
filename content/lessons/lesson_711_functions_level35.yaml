challenge: |
  🎯 Challenge: Can you call min_and_max with [10, 3, 25, 1, 18] instead, so it prints 24?
expected_output: "24"
hints:
  - "Change the list you pass into min_and_max(...)."
  - "The smallest number is 1 and the largest is 25, so the difference is 24."
  - "It should look like: min_and_max([10, 3, 25, 1, 18])"
