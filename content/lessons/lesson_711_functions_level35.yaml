id: lesson_711
title: "Functions: Level 32 ⚙️"
level: 711
objective: "Return a tuple from a function and use both values in further computation outside it."
explanation: |
  A function's tuple return can feed straight into more math outside the function, exactly like a single return value can. min_and_max(numbers) hands back both the smallest and largest number in a list.

  low, high = min_and_max(...) unpacks both, and the caller can then compute anything it wants with them -- here, the difference between the two.
example_code: |
  def min_and_max(numbers):
      smallest = numbers[0]
      largest = numbers[0]
      for n in numbers:
          if n < smallest:
              smallest = n
          if n > largest:
              largest = n
      return smallest, largest

  low, high = min_and_max([4, 9, 2, 7, 5])
  print(high - low)
starter_code: |
