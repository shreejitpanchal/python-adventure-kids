id: lesson_511
title: "Numbers: Level 32 🔢"
level: 511
objective: "Use a chained comparison on the result of an addition."
explanation: |
  You can chain comparisons around a calculation too, not just plain numbers.

  5 < 3 + 4 < 10 first works out 3 + 4 (which is 7), then checks if it's between 5 and 10.
example_code: |
  print(5 < 3 + 4 < 10)
starter_code: |
  print(5 < 3 + 4 < 10)
challenge: |
  🎯 Challenge: Can you make Python check if 4 + 3 is between 10 and 20?
expected_output: "False"
hints:
  - "Change the numbers to 10, 4 + 3, and 20."
  - "Python works out 4 + 3 first, then checks both sides."
  - "It should look like: print(10 < 4 + 3 < 20)"
