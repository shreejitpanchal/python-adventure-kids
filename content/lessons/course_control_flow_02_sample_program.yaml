id: course_control_flow_2
title: "Your Sample Program with Conditionals 🚦"
level: 907
objective: "Use elif to check more than two possible outcomes."
explanation: |
  elif ("else if") lets you check another condition if the first one was False -- Python checks each one in order and runs the first one that's True.
example_code: |
  score = 85
  if score >= 90:
      print("Grade: A")
  elif score >= 80:
      print("Grade: B")
  else:
      print("Grade: C")
