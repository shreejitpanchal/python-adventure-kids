id: lesson_590
title: "Division: Level 31 ➗"
level: 590
objective: "Use parentheses to force addition to happen before division."
explanation: |
  Parentheses run first, before anything else — they let you override the normal order of operations.

  print((10 + 10) / 4) adds 10 and 10 first (20), then divides by 4 — giving 5.0.
example_code: |
  print((10 + 10) / 4)
starter_code: |
  print((10 + 10) / 4)
challenge: |
  🎯 Challenge: Add 18 and 6 together first, then divide the result by 4.
expected_output: "6.0"
hints:
  - "Change the numbers to 18, 6, and 4, keeping the parentheses."
  - "The parentheses force the addition to happen first."
  - "It should look like: print((18 + 6) / 4)"
