challenge: |
  🎯 Challenge: Change ticket_text so Python prints "Teen ticket: Half price." instead.
expected_output: "Teen ticket: Half price."
hints:
  - "has_id is already \"yes\" and ticket_text is already all digits — only the age range needs to change."
  - "The teen branch needs age to be 13 or more, but less than 18."
  - "Try ticket_text = \"15\"."
