id: lesson_554
title: "Subtraction: Level 35 ➖"
level: 554
objective: "Subtract a chain of three numbers, then raise the total to a power."
explanation: |
  You can combine chained subtraction with ** -- Python subtracts everything first, then raises that result to a power.

  (10 - 2 - 3) ** 2 subtracts first (getting 5), then squares it: 25.
example_code: |
  print((10 - 2 - 3) ** 2)
starter_code: |
  print((10 - 2 - 3) ** 2)
challenge: |
  🎯 Challenge: Subtract 5 and then 6 from 20, then raise the result to the power of 2.
expected_output: "81"
hints:
  - "Change the chain to 20 - 5 - 6, keep ** 2."
  - "The parentheses make sure all the subtracting happens before the power."
  - "It should look like: print((20 - 5 - 6) ** 2)"
