id: lesson_704
title: "Functions: Level 25 ⚙️"
level: 704
objective: "Build and return a list from inside a function using a loop."
explanation: |
  A function can build up a whole list internally with a loop, then hand the finished list back with return -- not just take a list in as a parameter.

  make_multiples(n, count) starts with an empty list, appends count multiples of n one at a time, then returns the completed list.
example_code: |
  def make_multiples(n, count):
      result = []
      for i in range(1, count + 1):
          result.append(n * i)
      return result

  print(make_multiples(3, 5))
starter_code: |
  def make_multiples(n, count):
      result = []
      for i in range(1, count + 1):
          result.append(n * i)
      return result

  print(make_multiples(3, 5))
challenge: |
  🎯 Challenge: Can you call make_multiples with 4 and 6 instead, so it prints [4, 8, 12, 16, 20, 24]?
expected_output: "[4, 8, 12, 16, 20, 24]"
hints:
  - "Change both numbers you pass into make_multiples(...)."
  - "make_multiples(4, 6) builds the first 6 multiples of 4."
  - "It should look like: print(make_multiples(4, 6))"
