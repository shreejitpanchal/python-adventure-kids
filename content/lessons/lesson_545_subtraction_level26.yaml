id: lesson_545
title: "Subtraction: Level 26 ➖"
level: 545
objective: "Compare two chains of subtraction, each made of three numbers, using min()."
explanation: |
  min() can compare longer chains of subtraction, not just two numbers -- Python works out each full chain first, then compares them.

  min(30 - 5 - 10, 25 - 3 - 4) works out both chains (15 and 18), then picks the smaller.
example_code: |
  print(min(30 - 5 - 10, 25 - 3 - 4))
starter_code: |
  print(min(30 - 5 - 10, 25 - 3 - 4))
challenge: |
  🎯 Challenge: Which is smaller: 40 - 10 - 15 or 35 - 5 - 20? Make Python find out.
expected_output: "10"
hints:
  - "Change the two chains to 40 - 10 - 15 and 35 - 5 - 20."
  - "min() works out both full chains first, then compares them."
  - "It should look like: print(min(40 - 10 - 15, 35 - 5 - 20))"
