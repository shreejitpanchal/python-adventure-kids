id: lesson_324
title: "Ask a Question: Level 6 🙋"
level: 324
objective: "Multiply whatever number you type by a fixed number."
explanation: |
  * multiplies two numbers together, and one of them can come straight from input().

  n = int(input("Type a number: ")) stores your number, then print(n * 3) multiplies it by 3.
example_code: |
  n = int(input("Type a number: "))
  print(n * 3)
