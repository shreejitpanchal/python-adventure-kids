id: lesson_54
title: "Numbers: Level 10 🔢"
level: 54
objective: "Compare two numbers with == to check if they're equal."
explanation: |
  == asks "are these two numbers exactly equal?" (Two equal signs, not one — one = is for storing, two == is for asking.)

  6 == 6 is True, because they match.
example_code: |
  print(6 == 6)
starter_code: |
  print(6 == 6)
challenge: |
  🎯 Challenge: Can you make Python check if 5 is equal to 9?
expected_output: "False"
hints:
  - "Change the numbers to 5 and 9."
  - "It should look like: print(5 == 9)"
