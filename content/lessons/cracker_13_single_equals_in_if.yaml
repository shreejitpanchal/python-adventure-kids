id: cracker_13
title: "Code Cracker: The Assignment Trap 🧩"
level: 448
objective: "Fix a SyntaxError caused by using = instead of == inside an if condition."
explanation: |
  A single = stores a value in a variable. A double == asks "are
  these equal?" Mixing them up inside an if condition is a super
  common mistake -- Python won't even let a plain = run there.
example_code: |
  password = "sunshine"
  if password == "sunshine":
      print("Access granted!")
starter_code: |
  password = "sunshine"
  if password = "sunshine":
      print("Access granted!")
challenge: |
  🎯 This code won't run! Fix the condition so it compares instead of assigns.
expected_output: "Access granted!"
ast_contains: ["if"]
hints:
  - "password = \"sunshine\" stores a value -- that's not a question."
  - "Use == to ask if two things are equal."
  - "It should look like: if password == \"sunshine\":"
reward_stars: 3
