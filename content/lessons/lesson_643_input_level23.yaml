id: lesson_643
title: "Ask a Question: Level 24 🙋"
level: 643
objective: "Reverse a typed word using slicing."
explanation: |
  You've reversed strings before with [::-1]. It works just as well on something you type in!

  word = input("Type a word: ") stores your word. print(word[::-1]) prints it backwards.
example_code: |
  word = input("Type a word: ")
  print(word[::-1])
starter_code: |
  word = input("Type a word: ")
  print(word[::-1])
challenge: |
  🎯 Challenge: Type the word otter in the box below, then press RUN to see it reversed!
expected_output: "Type a word: retto"
input_prompt: "Type a word:"
hints:
