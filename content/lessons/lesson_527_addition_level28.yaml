id: lesson_527
title: "Addition: Level 28 ➕"
level: 527
objective: "Add two numbers, then check if the sum is evenly divisible using %."
explanation: |
  Combining + with % lets you check if a total splits evenly into groups -- if the remainder is 0, it divides evenly.

  (8 + 4) % 3 == 0 adds first (getting 12), then checks if 12 divides evenly by 3: True.
example_code: |
  print((8 + 4) % 3 == 0)
starter_code: |
  print((8 + 4) % 3 == 0)
challenge: |
  🎯 Challenge: Add 14 and 13, then check if the result divides evenly by 4.
expected_output: "False"
hints:
  - "Change the numbers to 14, 13, and 4."
  - "14 + 13 is 27 -- does 4 divide evenly into 27?"
  - "It should look like: print((14 + 13) % 4 == 0)"
