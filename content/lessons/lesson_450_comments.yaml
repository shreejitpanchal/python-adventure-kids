id: lesson_450
title: "Leaving Notes with Comments 💬"
level: 450
objective: "Use # to write a comment that Python ignores."
explanation: |
  Sometimes you want to leave yourself a little note inside your code — Python calls
  these comments.

  Anything after a # on a line is completely ignored when the program runs. It's not
  a print(), it doesn't show up anywhere — it's just for humans reading the code.

  Programmers use comments to explain WHY they wrote something, or to remind themselves
  what to fix later.
example_code: |
  # This is a comment -- Python skips right over it.
  print("Comments help you leave notes in your code!")
  # You can write anything here, even silly stuff like: bananas are cool
starter_code: |
  # This is a comment -- Python skips right over it.
  print("Comments help you leave notes in your code!")
  # You can write anything here, even silly stuff like: bananas are cool
challenge: |
  🎯 Challenge: Press RUN, then add your OWN comment on a new line — see that it doesn't
  change what gets printed!
expected_output: "Comments help you leave notes in your code!"
ast_contains: []
hints:
  - "Start a comment with # — everything after it on that line is ignored."
  - "A comment never shows up in \"What Python Says\" — only print() does that."
  - "Try adding a line like # my favorite color is blue and press RUN again."
