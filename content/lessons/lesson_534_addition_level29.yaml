id: lesson_534
title: "Addition: Level 29 ➕"
level: 534
objective: "Compare two different sums and find the smaller one."
explanation: |
  min() can compare the results of two additions, not just two plain numbers.

  min(4 + 3, 8 + 1) works out both sums first (7 and 9), then hands back the smaller one.
example_code: |
  print(min(4 + 3, 8 + 1))
starter_code: |
  print(min(4 + 3, 8 + 1))
challenge: |
  🎯 Challenge: Which is smaller: 5 + 5 or 2 + 9? Make Python find out.
expected_output: "10"
hints:
  - "Change the two sums to 5 + 5 and 2 + 9."
  - "It should look like: print(min(5 + 5, 2 + 9))"
