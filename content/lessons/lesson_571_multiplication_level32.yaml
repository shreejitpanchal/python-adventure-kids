id: lesson_571
title: "Multiplication: Level 32 ✖️"
level: 571
objective: "Convert text to a number, then use it in a multi-step multiplication expression."
explanation: |
  int() still turns text into a real number first — after that, the normal order of operations takes over.
example_code: |
  print(int("3") * 4 + 2)
starter_code: |
  print(int("3") * 4 + 2)
challenge: |
  🎯 Challenge: Convert the text "5" into a number, multiply it by 6, then add 3.
expected_output: "33"
hints:
  - "Change \"3\" to \"5\", 4 to 6, and 2 to 3."
  - "It should look like: print(int(\"5\") * 6 + 3)"
