id: cracker_29
title: "Code Cracker: Not Really Equal 🧩"
level: 464
objective: "Fix a comparison bug caused by comparing a number to text that looks like a number."
explanation: |
  5 (a number) and "5" (text) are never equal to Python, even
  though they look the same to us. == checks both the value AND
  the type, so a number and matching text always compare False.
example_code: |
  lives = 5
  if lives == 5:
      print("Five lives left!")
starter_code: |
  lives = 5
  if lives == "5":
      print("Five lives left!")
challenge: |
  🎯 Nothing prints, even though lives is 5! Fix the comparison so it checks against a real number.
expected_output: "Five lives left!"
ast_contains: ["if"]
hints:
  - "lives is a number, but \"5\" in quotes is text -- they're not the same to Python."
  - "Remove the quotes so you're comparing two numbers."
  - "It should look like: if lives == 5:"
