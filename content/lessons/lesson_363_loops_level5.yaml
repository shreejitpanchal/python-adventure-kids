id: lesson_363
title: "Loops: Level 5 🔁"
level: 363
objective: "Use a negative step to count backwards with range()."
explanation: |
  The step in range() can be negative, which makes Python count DOWN instead of up.

  range(10, 0, -1) starts at 10 and subtracts 1 each time, stopping just before 0 — so it counts 10, 9, 8, all the way down to 1.
example_code: |
  for i in range(10, 0, -1):
      print(i)
starter_code: |
  for i in range(10, 0, -1):
      print(i)
challenge: |
  🎯 Challenge: Can you make it count down from 5 to 1 instead?
expected_output: |
  5
  4
  3
  2
  1
hints:
  - "Change range(10, 0, -1) to range(5, 0, -1)."
  - "The stop number (0) still never gets printed — the loop stops just before it."
