id: lesson_443
title: "Robot Adventure: Coin Collector 🤖"
level: 443
objective: "Collect coins along the way using game.coins_collected()."
explanation: |
  game.place_coin(col, row) drops a shiny coin on a square. The robot picks it up
  automatically just by driving onto that square — no extra code needed!

  game.coins_collected() tells you how many coins the robot has picked up so far, as a
  number you can print.
example_code: |
  game.set_background("black")
  game.create_grid(4, 1)
  game.place_coin(1, 0)
  game.place_coin(2, 0)
  game.place_goal(3, 0)
  game.place_robot(0, 0, "E")
  game.robot_forward()
  game.robot_forward()
  game.robot_forward()
  print("Coins collected:", game.coins_collected())
starter_code: |
