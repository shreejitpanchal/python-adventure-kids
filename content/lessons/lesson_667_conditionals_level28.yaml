challenge: |
  🎯 Challenge: Change temperature and is_windy so Python prints "Perfect beach day!" instead.
expected_output: "Perfect beach day!"
hints:
  - "The first branch needs temperature to be 80 or more AND is_windy to be \"no\"."
  - "Both parts of that and have to be true at once for the first branch to run."
  - "Try temperature = 85 and is_windy = \"no\"."
