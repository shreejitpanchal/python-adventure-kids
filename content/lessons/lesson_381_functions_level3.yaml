id: lesson_381
title: "Functions: Level 3 ⚙️"
level: 381
objective: "Give a function two parameters."
explanation: |
  A function's machine can have more than one labeled box. Separate them with a comma inside the parentheses, and fill both boxes when you call it.

  def introduce(name, age): has two parameters. introduce("Sam", 10) fills name with "Sam" and age with 10, in that order.
example_code: |
  def introduce(name, age):
      print(name + " is " + str(age) + " years old.")

  introduce("Sam", 10)
starter_code: |
  def introduce(name, age):
      print(name + " is " + str(age) + " years old.")

  introduce("Sam", 10)
challenge: |
  🎯 Challenge: Can you call introduce with the name "Mia" and the age 12, so it prints "Mia is 12 years old."?
expected_output: "Mia is 12 years old."
hints:
  - "Change both values you pass into introduce(...)."
  - "The first box is name, the second box is age -- keep them in that order."
  - "It should look like: introduce(\"Mia\", 12)"
