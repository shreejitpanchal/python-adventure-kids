id: lesson_654
title: "Ask a Question: Level 35 🙋"
level: 654
objective: "Pad a typed number with leading zeros using .zfill()."
explanation: |
  .zfill() works on typed text too — no conversion needed, since it's still a string.

  n = input("Type a number: ") keeps your answer as text. print(n.zfill(5)) pads it with zeros until it's 5 characters long.
example_code: |
  n = input("Type a number: ")
  print(n.zfill(5))
starter_code: |
  n = input("Type a number: ")
  print(n.zfill(5))
challenge: |
  🎯 Challenge: Type the number 42 in the box below, then press RUN to see it padded into a 5-digit code!
expected_output: "Type a number: 00042"
input_prompt: "Type a number:"
hints:
  - "Type 42 in the answer box above the RUN button."
  - ".zfill(5) adds zeros to the front until the text is 5 characters long."
  - "You don't need to change the code — just type 42 and press RUN!"
