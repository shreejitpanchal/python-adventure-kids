id: lesson_647
title: "Ask a Question: Level 28 🙋"
level: 647
objective: "Print both the floor division and remainder of a typed number in one program."
explanation: |
  You've used // and % separately before. This time, both run one after another on the same typed number.

  n = int(input("Type a number: ")) stores your number. print(n // 3) shows how many whole 3s fit inside it, and print(n % 3) shows what's left over.
example_code: |
  n = int(input("Type a number: "))
  print(n // 3)
  print(n % 3)
starter_code: |
  n = int(input("Type a number: "))
  print(n // 3)
  print(n % 3)
challenge: |
  🎯 Challenge: Type the number 17 in the box below, then press RUN to see how many 3s fit inside it, and what's left over!
expected_output: |
  Type a number: 5
  2
input_prompt: "Type a number:"
hints:
  - "Type 17 in the answer box above the RUN button."
  - "// counts whole groups, and % shows what's left over after those groups are removed."
  - "You don't need to change the code — just type 17 and press RUN!"
