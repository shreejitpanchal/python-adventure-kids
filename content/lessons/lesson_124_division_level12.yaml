id: lesson_124
title: "Division: Level 12 ➗"
level: 124
objective: "Use // and % together to show whole times and the remainder."
explanation: |
  // and % are a great team: // shows how many whole times one number fits, and % shows what's left over.
example_code: |
  print(17 // 5, 17 % 5)
starter_code: |
  print(17 // 5, 17 % 5)
challenge: |
  🎯 Challenge: Print how many times 5 goes into 27, and the remainder, using // and %.
expected_output: "5 2"
hints:
  - "Change both numbers: 27 // 5 and 27 % 5."
  - "It should look like: print(27 // 5, 27 % 5)"
