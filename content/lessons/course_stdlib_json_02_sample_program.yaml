challenge: |
  🎯 Challenge: Change the score value in the JSON string from 90 to 100, then run it.
expected_output: |
  100
hints:
  - "Change the 90 inside the quotes in the data string"
  - "json.loads() turns the string into a dictionary you can index with [\"score\"]"
  - "It should look like: '{\"name\": \"Sam\", \"score\": 100}'"
