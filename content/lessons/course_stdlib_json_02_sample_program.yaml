id: course_stdlib_json_2
title: "Your Sample Program with JSON 🧾"
level: 979
objective: "Use json.loads() to parse a JSON string back into a Python dictionary."
explanation: |
  json.loads() does the opposite of dumps() -- it turns a JSON-formatted string back into a real Python dictionary you can read values from.
example_code: |
  import json
  data = '{"name": "Sam", "score": 90}'
  profile = json.loads(data)
  print(profile["score"])
starter_code: |
  import json
  data = '{"name": "Sam", "score": 90}'
