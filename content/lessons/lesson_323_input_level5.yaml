id: lesson_323
title: "Ask a Question: Level 5 🙋"
level: 323
objective: "Add a fixed number onto whatever number you type."
explanation: |
  Once your typed answer becomes a real number, you can add to it just like any other number.

  n = int(input("Type a number: ")) stores your number, then print(n + 10) adds 10 onto it.
example_code: |
  n = int(input("Type a number: "))
  print(n + 10)
