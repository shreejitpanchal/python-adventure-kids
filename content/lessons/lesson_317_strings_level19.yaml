id: lesson_317
title: "Strings: Level 19 🔤"
level: 317
objective: "Chain two string methods together in a single line."
explanation: |
  Methods can be chained one after another — raw.strip().upper() first strips off the extra spaces, then uppercases what's left, all in one line.

  Python runs them left to right: .strip() happens first, and .upper() works on whatever .strip() hands back.
example_code: |
  raw = "   loud now   "
  print(raw.strip().upper())
starter_code: |
  raw = "   loud now   "
  print(raw.strip().upper())
challenge: |
  🎯 Challenge: Change raw to "   quiet please   " and print it stripped and uppercased.
expected_output: "QUIET PLEASE"
hints:
  - "Change \"loud now\" to \"quiet please\", but keep the extra spaces around it inside the quotes."
  - "You don't need to change .strip().upper() at all — it already does both steps."
  - "It should look like: raw = \"   quiet please   \", print(raw.strip().upper())"
