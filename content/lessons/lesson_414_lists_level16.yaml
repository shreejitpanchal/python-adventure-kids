id: lesson_414
title: "Lists: Level 16 🎒"
level: 414
objective: "Compute the average of a list of numbers with sum() and len()."
explanation: |
  The average of a list is the total divided by how many items there are. sum(grades) adds every number together, and len(grades) counts how many numbers are in the list.

  Dividing sum(grades) by len(grades) gives you the average — the "typical" value across the whole backpack.
example_code: |
  grades = [80, 90, 100, 70]
  average = sum(grades) / len(grades)
  print(average)
starter_code: |
  grades = [80, 90, 100, 70]
  average = sum(grades) / len(grades)
  print(average)
challenge: |
  🎯 Challenge: Can you change the grades to [60, 75, 85, 100] and print their average?
expected_output: "80.0"
hints:
  - "Change grades = [...] to the new list of four grades."
  - "sum(...) and len(...) still work the same way — divide the sum by the length."
  - "It should look like: grades = [60, 75, 85, 100], average = sum(grades) / len(grades), then print(average)"
