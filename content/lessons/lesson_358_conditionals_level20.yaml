id: lesson_358
title: "Decisions: Level 20 🚦"
level: 358
objective: "Combine int(), arithmetic, and an elif chain into one small program."
explanation: |
  This capstone puts everything together: converting text to numbers with int(), doing arithmetic on the results, and sorting the result with an elif chain.

  total = price * quantity works out the order total, and the elif chain then decides which message fits that total.
example_code: |
  price_text = "8"
  quantity_text = "3"
  price = int(price_text)
  quantity = int(quantity_text)
  total = price * quantity
  if total >= 50:
      print("Big order! Total: " + str(total))
  elif total >= 20:
      print("Nice order! Total: " + str(total))
  else:
      print("Small order. Total: " + str(total))
