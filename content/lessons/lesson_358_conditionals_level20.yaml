challenge: |
  🎯 Challenge: Change price_text and quantity_text so Python prints "Big order! Total: 60" instead.
expected_output: "Big order! Total: 60"
hints:
  - "total = price * quantity, then the elif chain checks how big total is."
  - "You need total to work out to exactly 60."
  - "Try price_text = \"10\" and quantity_text = \"6\" (10 * 6 = 60)."
