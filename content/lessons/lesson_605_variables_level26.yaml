id: lesson_605
title: "Variables: Level 26 📦"
level: 605
objective: "Use **= as a shortcut for raising a variable to a power."
explanation: |
  base **= 2 is a shortcut for base = base ** 2 — it raises whatever is inside base to that power.
example_code: |
  base = 3
  base **= 2
  print(base)
starter_code: |
  base = 3
  base **= 2
  print(base)
challenge: |
  🎯 Challenge: Start power at 2, then use **= to raise it to the 4th power. Print power.
expected_output: "16"
hints:
  - "Change power to 2, then write power **= 4."
  - "It should look like: power = 2, power **= 4, print(power)"
