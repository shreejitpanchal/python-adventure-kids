  divide(10, 2)
challenge: |
  🎯 Challenge: Change divide(10, 2) to divide(10, 0), then run it.
expected_output: |
  [INFO] Dividing 10 by 0
  [ERROR] Cannot divide by zero!
hints:
  - "Change the 2 inside divide(10, 2) to a 0"
  - "Dividing by 0 triggers the [ERROR] message instead of a result."
  - "It should look like: divide(10, 0)"
