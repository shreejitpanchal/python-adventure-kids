id: lesson_337
title: "Ask a Question: Level 19 🙋"
level: 337
objective: "Convert a Celsius temperature to Fahrenheit using a real formula."
explanation: |
  Scientists and weather forecasters use a real formula to convert Celsius to Fahrenheit: celsius * 9 / 5 + 32.

  celsius = float(input("What is the temperature in Celsius? ")) stores the temperature you type. print(celsius * 9 / 5 + 32) runs it through the formula and prints the Fahrenheit answer.
example_code: |
  celsius = float(input("What is the temperature in Celsius? "))
  print(celsius * 9 / 5 + 32)
starter_code: |
  celsius = float(input("What is the temperature in Celsius? "))
  print(celsius * 9 / 5 + 32)
challenge: |
  🎯 Challenge: Type the temperature 20 in the box below, then press RUN to convert it to Fahrenheit!
expected_output: "What is the temperature in Celsius? 68.0"
input_prompt: "What is the temperature in Celsius?"
hints:
