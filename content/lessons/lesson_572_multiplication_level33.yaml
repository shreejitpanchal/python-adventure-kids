id: lesson_572
title: "Multiplication: Level 33 ✖️"
level: 572
objective: "See that ** happens before * in the order of operations."
explanation: |
  Exponents run even before multiplication. print(2 * 3 ** 2) works out 3 ** 2 first (9), then multiplies by 2 — giving 18.
example_code: |
  print(2 * 3 ** 2)
starter_code: |
  print(2 * 3 ** 2)
challenge: |
  🎯 Challenge: Multiply 2 by 5 squared, without using parentheses.
expected_output: "50"
hints:
  - "Change the numbers to 2 and 5, keep ** 2."
  - "Python raises 5 to the power of 2 before multiplying."
  - "It should look like: print(2 * 5 ** 2)"
