challenge: |
  🎯 Challenge: Change age_text so Python prints "You are 12 years old." instead.
expected_output: "You are 12 years old."
hints:
  - "age_text needs to be a string of digits, not letters."
  - ".isdigit() only lets the if branch run when the text is all digits."
  - "Try age_text = \"12\"."
