id: lesson_666
title: "Decisions: Level 27 🚦"
level: 666
objective: "Use .isdigit() to guard against converting text that isn't actually a number."
explanation: |
  Before converting text to a number with int(), it's smart to check it's really a number first — otherwise int() would crash.

  if age_text.isdigit(): only converts and uses age_text when every character in it really is a digit.
example_code: |
  age_text = "abc"
  if age_text.isdigit():
      age = int(age_text)
      print("You are " + str(age) + " years old.")
  else:
      print("That doesn't look like a number.")
starter_code: |
  age_text = "abc"
  if age_text.isdigit():
      age = int(age_text)
      print("You are " + str(age) + " years old.")
  else:
