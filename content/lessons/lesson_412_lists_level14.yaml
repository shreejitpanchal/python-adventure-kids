id: lesson_412
title: "Lists: Level 14 🎒"
level: 412
objective: "Count how many times an item appears with .count(...)."
explanation: |
  .count(...) searches a list and tells you how many times a particular item shows up — handy when the same value appears more than once.

  letters.count("a") looks through the whole backpack and counts every "a" it finds.
example_code: |
  letters = ["a", "b", "a", "c", "a"]
  print(letters.count("a"))
starter_code: |
  letters = ["a", "b", "a", "c", "a"]
  print(letters.count("a"))
challenge: |
  🎯 Challenge: Can you change the backpack to ["z", "x", "z", "z", "y", "z"] and count how many times "z" shows up?
expected_output: "4"
hints:
  - "Change letters = [...] to the new list of six letters."
  - ".count(...) still tells you how many times an item appears — call it like letters.count(\"z\")."
  - "It should look like: letters = [\"z\", \"x\", \"z\", \"z\", \"y\", \"z\"], then print(letters.count(\"z\"))"
