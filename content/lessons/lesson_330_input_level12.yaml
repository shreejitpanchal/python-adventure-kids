id: lesson_330
title: "Ask a Question: Level 12 🙋"
level: 330
objective: "Use // to count how many whole times 5 fits into a typed number."
explanation: |
  // is floor division — it counts how many whole times one number fits inside another, throwing away any leftover.

  n = int(input("Type a number: ")) stores your number. print(n // 5) shows how many whole groups of 5 fit inside n.
example_code: |
  n = int(input("Type a number: "))
  print(n // 5)
starter_code: |
  n = int(input("Type a number: "))
  print(n // 5)
challenge: |
  🎯 Challenge: Type the number 23 in the box below, then press RUN to see how many 5s fit inside it!
expected_output: "Type a number: 4"
input_prompt: "Type a number:"
hints:
  - "Type 23 in the answer box above the RUN button."
  - "// counts whole groups and ignores the leftover — 4 whole groups of 5 fit inside 23."
  - "You don't need to change the code — just type 23 and press RUN!"
