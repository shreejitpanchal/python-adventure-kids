id: lesson_406
title: "Lists: Level 8 🎒"
level: 406
objective: "Add up all the numbers in a list using a loop."
explanation: |
  Lists can hold numbers too! To add them all up, start a total at 0, then loop through the list adding each number to the total.

  total += n means "add n to total and save it back into total" — after the loop finishes, total holds the sum of everything in the list.
example_code: |
  numbers = [4, 8, 15]
  total = 0
  for n in numbers:
      total += n
  print(total)
starter_code: |
  numbers = [4, 8, 15]
  total = 0
  for n in numbers:
      total += n
  print(total)
challenge: |
  🎯 Challenge: Can you change the backpack to [10, 20, 30, 5], then add up every number and print the total?
expected_output: "65"
hints:
  - "Change numbers = [...] to the new list of four numbers."
  - "The loop itself doesn't need to change — total = 0, then for n in numbers: total += n."
  - "It should look like: numbers = [10, 20, 30, 5], total = 0, then for n in numbers: total += n, then print(total)"
