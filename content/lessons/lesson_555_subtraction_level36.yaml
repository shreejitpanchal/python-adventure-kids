id: lesson_555
title: "Subtraction: Level 36 ➖"
level: 555
objective: "Compare a chain of decimal subtraction, including a subtracted negative, against a target."
explanation: |
  You can compare the result of a whole decimal chain, not just a single subtraction.

  10.5 - 2.5 - -1.0 > 8 subtracts everything first (getting 9.0), then checks if that's greater than 8.
example_code: |
  print(10.5 - 2.5 - -1.0 > 8)
starter_code: |
  print(10.5 - 2.5 - -1.0 > 8)
challenge: |
  🎯 Challenge: Can you check if 15.5 - 8.5 - -1.0 is greater than 10?
expected_output: "False"
hints:
  - "Change the numbers to 15.5, 8.5, -1.0, and 10."
  - "Python works out the whole chain first, then compares."
  - "It should look like: print(15.5 - 8.5 - -1.0 > 10)"
