id: lesson_402
title: "Lists: Level 4 🎒"
level: 402
objective: "Use len() to count how many items are in a list."
explanation: |
  len(...) counts how many items are packed inside a list — just like it counts letters in a word.

  toys = ["robot", "ball", "kite", "yo-yo"] has four items, so len(toys) gives back 4.
example_code: |
  toys = ["robot", "ball", "kite", "yo-yo"]
  print(len(toys))
starter_code: |
  toys = ["robot", "ball", "kite", "yo-yo"]
  print(len(toys))
challenge: |
  🎯 Challenge: Can you change the backpack to ["car", "doll", "blocks", "puzzle", "top"] and print how many toys are packed inside?
expected_output: "5"
hints:
  - "Change toys = [...] to the new list of five toys."
  - "len(...) still tells you how many items are in a list — it doesn't need to change."
  - "It should look like: toys = [\"car\", \"doll\", \"blocks\", \"puzzle\", \"top\"], then print(len(toys))"
