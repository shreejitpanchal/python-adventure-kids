challenge: |
  🎯 Challenge: Press RUN to roll two dice — see if you can land on doubles!
expected_output_pattern: "^You rolled a ([1-6]) and a (?:\\1!\\nDoubles!|(?!\\1)[1-6]!)$"
hints:
