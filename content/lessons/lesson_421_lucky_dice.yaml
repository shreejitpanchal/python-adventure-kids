id: lesson_421
title: "Lucky Dice 🎲"
level: 421
objective: "Roll two random dice with random.randint() and use if to check for a match."
explanation: |
  Let's roll some dice! random.randint(1, 6) picks a whole number from 1 to 6 — just like a real six-sided die — and we do it twice to roll two dice.

  roll1 and roll2 store the two rolls, and we print them both.

  Then if roll1 == roll2: checks whether the two dice match. If they do, that's called "doubles," and we print an extra line to celebrate!
example_code: |
  import random

  roll1 = random.randint(1, 6)
  roll2 = random.randint(1, 6)

  print("You rolled a " + str(roll1) + " and a " + str(roll2) + "!")

  if roll1 == roll2:
      print("Doubles!")
starter_code: |
