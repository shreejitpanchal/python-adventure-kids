id: lesson_416
title: "Lists: Level 18 🎒"
level: 416
objective: "Write a function that takes a list as a parameter and returns a value."
explanation: |
  Functions can work with lists just like any other value. def total_of(numbers): defines a function that accepts a list, and return sum(numbers) hands back the total of everything inside it.

  Once defined, you can call total_of(prices) with any list of numbers, and it will add them all up for you.
example_code: |
  def total_of(numbers):
      return sum(numbers)

  prices = [3, 5, 10]
  print(total_of(prices))
starter_code: |
  def total_of(numbers):
      return sum(numbers)

  prices = [3, 5, 10]
  print(total_of(prices))
challenge: |
  🎯 Challenge: Can you change the prices to [12, 8, 25] and print their total using the function?
expected_output: "45"
hints:
  - "Change prices = [...] to the new list of three prices."
  - "The function itself doesn't need to change — total_of(numbers) still returns sum(numbers)."
  - "It should look like: prices = [12, 8, 25], then print(total_of(prices))"
