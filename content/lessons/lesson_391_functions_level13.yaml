id: lesson_391
title: "Functions: Level 13 ⚙️"
level: 391
objective: "Reuse a two-parameter function with a different pair of arguments."
explanation: |
  Once a function is built, you can call it as many times as you like with completely different numbers -- the machine doesn't change, only what you feed into it.

  perimeter(width, height) works out the perimeter of a rectangle. Try it with a bigger rectangle and it just works.
example_code: |
  def perimeter(width, height):
      return 2 * (width + height)

  print(perimeter(3, 4))
starter_code: |
  def perimeter(width, height):
      return 2 * (width + height)

  print(perimeter(3, 4))
challenge: |
  🎯 Challenge: Can you call perimeter with width 10 and height 6, so it prints 32?
expected_output: "32"
hints:
  - "Change both numbers you pass into perimeter(...)."
  - "perimeter(10, 6) returns 2 * (10 + 6)."
  - "It should look like: print(perimeter(10, 6))"
