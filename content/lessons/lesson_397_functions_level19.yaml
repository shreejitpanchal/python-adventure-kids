challenge: |
  🎯 Challenge: Can you call count_vowels with "adventure" instead of "banana", so it prints the correct number of vowels?
expected_output: "4"
hints:
  - "Change the word you pass into count_vowels(...)."
  - "Count the vowels in \"adventure\" yourself: a, e, u, e."
  - "It should look like: print(count_vowels(\"adventure\"))"
