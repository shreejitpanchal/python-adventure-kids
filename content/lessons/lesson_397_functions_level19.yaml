id: lesson_397
title: "Functions: Level 19 ⚙️"
level: 397
objective: "Combine a loop and an if inside a function to solve a small task."
explanation: |
  Functions can combine everything you've learned so far -- a loop to look at every letter, and an if inside it to decide which letters count, building up an answer as it goes.

  count_vowels(word) walks through every letter in word, and whenever that letter is one of "aeiouAEIOU", it adds one to count. Once the loop is done, it returns the total.
example_code: |
  def count_vowels(word):
      count = 0
      for letter in word:
          if letter in "aeiouAEIOU":
              count += 1
      return count

  print(count_vowels("banana"))
