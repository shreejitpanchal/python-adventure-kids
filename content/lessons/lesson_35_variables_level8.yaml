id: lesson_35
title: "Variables: Level 8 📦"
level: 35
objective: "Use *= as a shortcut for multiplying a variable."
explanation: |
  points *= 3 is a shortcut for points = points * 3 — it multiplies whatever is inside points.
example_code: |
  points = 4
  points *= 3
  print(points)
starter_code: |
  points = 4
  points *= 3
  print(points)
challenge: |
  🎯 Challenge: Start points at 6, then use *= to multiply by 5. Print points.
expected_output: "30"
hints:
