id: lesson_409
title: "Lists: Level 11 🎒"
level: 409
objective: "Remove a specific item from a list with .remove(...)."
explanation: |
  .remove(...) searches a list for a matching item and takes it out. fruits.remove("apple") finds "apple" in the backpack and removes it, leaving everything else in place.

  Unlike indexing, you tell .remove(...) WHAT to take out, not WHERE it is.
example_code: |
  fruits = ["apple", "banana", "orange"]
  fruits.remove("apple")
  print(fruits)
starter_code: |
  fruits = ["apple", "banana", "orange"]
  fruits.remove("apple")
  print(fruits)
challenge: |
  🎯 Challenge: Can you change the backpack to ["mango", "kiwi", "pear"], take "kiwi" out, and print what's left?
expected_output: "['mango', 'pear']"
hints:
  - "Change fruits = [...] to the new list of three fruits."
  - ".remove(...) still takes a specific item out by name — call it like fruits.remove(\"kiwi\")."
  - "It should look like: fruits = [\"mango\", \"kiwi\", \"pear\"], fruits.remove(\"kiwi\"), then print(fruits)"
