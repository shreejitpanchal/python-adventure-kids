id: lesson_58
title: "Numbers: Level 14 🔢"
level: 58
objective: "Use ** to raise a number to a power."
explanation: |
  ** means "to the power of" — it multiplies a number by itself that many times.

  2 ** 5 means 2 multiplied by itself 5 times, which is 32.
example_code: |
  print(2 ** 5)
starter_code: |
  print(2 ** 5)
challenge: |
  🎯 Challenge: Can you make Python print 3 to the power of 4?
expected_output: "81"
hints:
  - "Change the numbers to 3 and 4."
  - "It should look like: print(3 ** 4)"
