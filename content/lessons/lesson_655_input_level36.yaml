id: lesson_655
title: "Ask a Question: Level 36 🙋"
level: 655
objective: "Convert a typed Celsius temperature to Fahrenheit, rounded and shown in one f-string."
explanation: |
  This combines the Celsius-to-Fahrenheit formula you've used before with round() and an f-string that shows both temperatures.

  fahrenheit = round(celsius * 9 / 5 + 32, 1) works out the formula and rounds it. The f-string then shows both celsius and fahrenheit together.
example_code: |
  celsius = float(input("What is the temperature in Celsius? "))
  fahrenheit = round(celsius * 9 / 5 + 32, 1)
  print(f"{celsius} C is {fahrenheit} F")
starter_code: |
  celsius = float(input("What is the temperature in Celsius? "))
