id: lesson_350
title: "Decisions: Level 12 🚦"
level: 350
objective: "Build a condition out of the result of some arithmetic."
explanation: |
  A condition doesn't have to check a single variable — it can check the result of some math, like an addition, worked out first.

  total = price1 + price2 stores the sum, and then if total > 100: checks that sum against 100.
example_code: |
  price1 = 40
  price2 = 55
  total = price1 + price2
  if total > 100:
      print("You get free shipping!")
  else:
      print("Add more to get free shipping.")
starter_code: |
  price1 = 40
  price2 = 55
