challenge: |
  🎯 Challenge: Change price1 and/or price2 so Python prints "You get free shipping!" instead.
expected_output: "You get free shipping!"
hints:
  - "Python adds price1 + price2 to make total."
  - "total needs to end up more than 100."
  - "Try price1 = 60 (60 + 55 = 115)."
