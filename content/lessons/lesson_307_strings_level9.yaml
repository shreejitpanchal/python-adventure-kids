id: lesson_307
title: "Strings: Level 9 🔤"
level: 307
objective: "Grab a single character from a string using its position."
explanation: |
  Every letter in a string has a position number, called an index, starting at 0 — not 1.

  word[0] grabs the very first letter. In "python", word[0] is "p" because p is in position 0.
example_code: |
  word = "python"
  print(word[0])
starter_code: |
  word = "python"
  print(word[0])
challenge: |
  🎯 Challenge: Change word to "galaxy" and print its first letter.
expected_output: "g"
hints:
  - "Change \"python\" to \"galaxy\", keeping the quotes."
  - "word[0] always grabs the first letter, no matter what the word is."
  - "It should look like: word = \"galaxy\", print(word[0])"
