id: lesson_441
title: "Robot Adventure: Turn and Go 🤖"
level: 441
objective: "Use game.robot_turn_right() to change the robot's direction."
explanation: |
  The robot can't only go straight — sometimes the goal is around a corner!

  game.robot_turn_right() spins the robot 90 degrees clockwise (its facing direction
  changes, but it doesn't move). game.robot_turn_left() spins it the other way. After
  turning, game.robot_forward() moves it in the NEW direction.
example_code: |
  game.set_background("black")
  game.create_grid(3, 3)
  game.place_goal(2, 1)
  game.place_robot(0, 0, "E")
  game.robot_forward()
  game.robot_forward()
  game.robot_turn_right()
  game.robot_forward()
starter_code: |
