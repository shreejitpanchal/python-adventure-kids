expected_output: ""
ast_contains: ["create_grid", "robot_turn_right", "robot_forward"]
requires_goal_reached: true
hints:
  - "The robot drives East twice, then needs to turn to reach the goal one row down."
  - "game.robot_turn_right() only changes direction — you still need robot_forward() to move."
  - "Try changing robot_turn_right() to robot_turn_left() and see what happens (hint: it won't reach the goal!)."
