id: lesson_591
title: "Division: Level 32 ➗"
level: 591
objective: "Convert text to a number, then use it in a multi-step division expression."
explanation: |
  int() still turns text into a real number first — after that, the normal order of operations takes over.
example_code: |
  print(int("20") / 4 + 1)
starter_code: |
  print(int("20") / 4 + 1)
challenge: |
  🎯 Challenge: Convert the text "30" into a number, divide it by 5, then add 2.
expected_output: "8.0"
hints:
