id: lesson_01
title: "Meet Python 🐍"
level: 1
objective: "Understand what a program is, and use print() for the first time."
explanation: |
  A computer program is just a list of instructions the computer follows, one by one.

  Python is a language we use to write those instructions so the computer understands them.

  The print() command tells the computer: "Show this on the screen!"
example_code: |
  print("Hello!")
starter_code: |
  print("Hello!")
challenge: |
  🎯 Challenge: Try changing the message inside the quotes to anything you like, then press RUN!
expected_output: "Hello!"
expected_output_pattern: "(?s).*"
ast_contains: [print]
hints:
  - "Make sure you use print(...) with round brackets."
  - "Text goes inside quotes, like \"Hello!\" -- but it can be anything you want!"
  - "Keep the quotes around your message, and press RUN to see what Python says back."
reward_stars: 3
badge: first_program
next_lesson_id: lesson_02
category: basics
category_level: 1
concept_tags: [print]
