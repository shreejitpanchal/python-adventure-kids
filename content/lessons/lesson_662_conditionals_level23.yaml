id: lesson_662
title: "Decisions: Level 23 🚦"
level: 662
objective: "Check whether a number falls in a range using a chained comparison."
explanation: |
  Python lets you chain two comparisons into one line: 10 <= age <= 15 checks that age is 10 or more AND 15 or less, all at once.

  This is a shortcut for writing age >= 10 and age <= 15 — Python understands it directly.
example_code: |
  age = 20
  if 10 <= age <= 15:
      print("You are in middle school range!")
  else:
      print("Outside that range.")
starter_code: |
  age = 20
