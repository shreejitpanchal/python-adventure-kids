id: lesson_529
title: "Addition: Level 30 ➕"
level: 529
objective: "Combine an f-string, addition, and a comparison in one print."
explanation: |
  You can put a whole comparison -- addition and all -- inside an f-string's curly braces.

  f"Result: {5 + 5 > 8}" adds first (getting 10), checks if it's greater than 8 (True), then shows it in the sentence.
example_code: |
  print(f"Result: {5 + 5 > 8}")
starter_code: |
  print(f"Result: {5 + 5 > 8}")
challenge: |
  🎯 Challenge: Can you show "Result: " followed by whether 4 + 3 is greater than 10?
expected_output: "Result: False"
hints:
  - "Change the numbers to 4, 3, and 10."
  - "Python adds first, then compares, then shows it in the sentence."
  - "It should look like: print(f\"Result: {4 + 3 > 10}\")"
