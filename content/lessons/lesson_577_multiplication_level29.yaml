id: lesson_577
title: "Multiplication: Level 29 ✖️"
level: 577
objective: "Use min() to find the smaller of two multiplication results."
explanation: |
  min() works out both products first, just like max() does, but hands back the smaller one instead.
example_code: |
  print(min(4 * 6, 3 * 9))
starter_code: |
  print(min(4 * 6, 3 * 9))
challenge: |
  🎯 Challenge: Which is smaller: 5 * 4 or 2 * 8? Make Python find out.
expected_output: "16"
hints:
  - "Change the two problems to 5 * 4 and 2 * 8."
  - "min() hands back the smaller answer, not the bigger one."
  - "It should look like: print(min(5 * 4, 2 * 8))"
