id: lesson_342
title: "Decisions: Level 4 🚦"
level: 342
objective: "Use and to check that two conditions are both true."
explanation: |
  and lets you check two conditions at once. The whole thing is only true when BOTH sides are true.

  if height >= 120 and age >= 8: only lets the child through when their height AND their age both meet the rule.
example_code: |
  height = 100
  age = 6
  if height >= 120 and age >= 8:
      print("You can ride the roller coaster!")
  else:
      print("Not yet - you need to grow a bit more.")
starter_code: |
