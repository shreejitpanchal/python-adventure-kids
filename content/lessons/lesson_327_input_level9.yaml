id: lesson_327
title: "Ask a Question: Level 9 🙋"
level: 327
objective: "Ask for an age and print the age 10 years from now."
explanation: |
  You already know how to add 1 to an age. You can add any number the same way!

  age = int(input("How old are you? ")) stores your age. print(age + 10) shows how old you'll be in 10 years.
example_code: |
  age = int(input("How old are you? "))
  print(age + 10)
starter_code: |
  age = int(input("How old are you? "))
  print(age + 10)
challenge: |
  🎯 Challenge: Type the age 9 in the box below, then press RUN to see your age in 10 years!
expected_output: "How old are you? 19"
input_prompt: "How old are you?"
hints:
  - "Type 9 in the answer box above the RUN button."
  - "age + 10 adds ten years onto your typed age."
  - "You don't need to change the code — just type 9 and press RUN!"
