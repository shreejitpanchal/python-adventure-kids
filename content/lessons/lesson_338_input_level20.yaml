id: lesson_338
title: "Ask a Question: Level 20 🙋"
level: 338
objective: "Combine input, int(), and +, -, * in one capstone program."
explanation: |
  You've learned a lot in this track: asking questions with input(), converting answers with int() and float(), and doing math with +, -, *, /, //, and %.

  This final challenge puts it all together — one typed number, three different pieces of math, three lines of output.
example_code: |
  n = int(input("Type a number: "))
  print(n + 4)
  print(n - 4)
  print(n * 4)
starter_code: |
  n = int(input("Type a number: "))
  print(n + 4)
  print(n - 4)
  print(n * 4)
challenge: |
  🎯 Challenge: Type the number 10 in the box below, then press RUN to see its sum, difference, and product with 4!
expected_output: "Type a number: 14\n6\n40"
input_prompt: "Type a number:"
hints:
  - "Type 10 in the answer box above the RUN button."
  - "Each print line shows one piece of math: adding 4, subtracting 4, and multiplying by 4."
  - "You don't need to change the code — just type 10 and press RUN!"
