id: lesson_46
title: "Variables: Level 19 📦"
level: 46
objective: "Update the same variable more than once in a row."
explanation: |
  You can update a variable again and again, one line at a time — each line builds on whatever came before it.
example_code: |
  x = 1
  x = x + 1
  x = x + 1
  print(x)
starter_code: |
  x = 1
