id: lesson_311
title: "Strings: Level 13 🔤"
level: 311
objective: "Swap part of a string for something else using .replace()."
explanation: |
  sentence.replace("old", "new") searches the string for "old" and swaps it out for "new" everywhere it appears.

  The original variable doesn't change — .replace() hands back a brand new string with the swap already done.
example_code: |
  sentence = "I like cats"
  print(sentence.replace("cats", "dogs"))
starter_code: |
  sentence = "I like cats"
  print(sentence.replace("cats", "dogs"))
challenge: |
  🎯 Challenge: Change sentence to "I like apples" and replace "apples" with "grapes".
expected_output: "I like grapes"
hints:
  - "Change sentence to \"I like apples\", and change the two words inside .replace() to \"apples\" and \"grapes\"."
  - ".replace(\"old\", \"new\") needs the exact word that's currently in the string as its first argument."
  - "It should look like: sentence = \"I like apples\", print(sentence.replace(\"apples\", \"grapes\"))"
