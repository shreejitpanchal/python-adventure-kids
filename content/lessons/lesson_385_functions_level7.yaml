id: lesson_385
title: "Functions: Level 7 ⚙️"
level: 385
objective: "Call one function from inside another function."
explanation: |
  Machines can use other machines. A function's body can call a different function and use what it returns, just like any other piece of code can.

  Here, show_square calls square(n) to do the actual work, then prints the result it gets back.
example_code: |
  def square(n):
      return n * n

  def show_square(n):
      result = square(n)
      print("Square:", result)

  show_square(3)
starter_code: |
  def square(n):
      return n * n

