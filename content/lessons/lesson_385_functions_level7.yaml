challenge: |
  🎯 Challenge: Can you call show_square with 6 instead of 3, so it prints "Square: 36"?
expected_output: "Square: 36"
hints:
  - "Change the number you pass into show_square(...)."
  - "show_square(6) calls square(6), which returns 6 * 6."
  - "It should look like: show_square(6)"
