id: lesson_122
title: "Division: Level 10 ➗"
level: 122
objective: "Use // to find how many whole times one number fits into another."
explanation: |
  // is called floor division — it divides and throws away anything after the decimal point, keeping only the whole number.

  17 // 5 is 3, because 5 fits into 17 three whole times (with some left over).
example_code: |
  print(17 // 5)
starter_code: |
  print(17 // 5)
challenge: |
  🎯 Challenge: How many whole times does 5 go into 23? Use // to find out.
expected_output: "4"
hints:
  - "Change the numbers to 23 and 5."
  - "It should look like: print(23 // 5)"
