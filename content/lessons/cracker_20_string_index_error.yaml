id: cracker_20
title: "Code Cracker: One Letter Too Far 🧩"
level: 455
objective: "Fix an IndexError caused by reading one character past the end of a string."
explanation: |
  "python" has 6 letters, at positions 0 through 5 -- there's no
  position 6. Asking for a position that doesn't exist crashes
  with an IndexError.
example_code: |
  word = "python"
  print(word[5])
starter_code: |
  word = "python"
  print(word[6])
challenge: |
  🎯 This code won't run! Count the letters in "python" and fix the index.
expected_output: "n"
ast_contains: ["print"]
hints:
  - "Count the letters in \"python\" -- how many are there?"
  - "Positions start at 0, so the last letter isn't at position 6."
  - "It should look like: word[5]"
