id: lesson_444
title: "Robot Adventure: Loop the Path 🤖"
level: 444
objective: "Use a for loop instead of repeating game.robot_forward() by hand."
explanation: |
  This grid is 6 squares long — the goal is 5 squares away! Typing
  game.robot_forward() five times in a row works, but there's a much better way.

  for step in range(5): repeats whatever's indented underneath it 5 times, so a single
  game.robot_forward() inside the loop drives the robot the whole way.
example_code: |
  game.set_background("black")
  game.create_grid(6, 1)
  game.place_goal(5, 0)
  game.place_robot(0, 0, "E")
  for step in range(5):
      game.robot_forward()
starter_code: |
  game.set_background("black")
  game.create_grid(6, 1)
  game.place_goal(5, 0)
