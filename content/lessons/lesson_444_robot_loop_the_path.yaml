challenge: |
  🎯 Challenge: Press RUN and watch the loop drive the robot all the way to the goal!
expected_output: ""
ast_contains: ["create_grid", "for", "robot_forward"]
requires_goal_reached: true
hints:
  - "range(5) means the loop runs 5 times — once for each square the robot needs to cross."
  - "Only the indented line (game.robot_forward()) repeats each time around the loop."
  - "Try changing range(5) to a smaller number and see the robot stop short of the goal."
