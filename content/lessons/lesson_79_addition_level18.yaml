id: lesson_79
title: "Addition: Level 18 ➕"
level: 79
objective: "Add two numbers, then raise the result to a power."
explanation: |
  You can combine + and ** — Python adds first, then raises that answer to a power.

  (3 + 2) ** 2 adds first (getting 5), then squares it: 25.
example_code: |
  print((3 + 2) ** 2)
starter_code: |
  print((3 + 2) ** 2)
challenge: |
  🎯 Challenge: Add 4 + 6, then raise the result to the power of 2.
expected_output: "100"
hints:
  - "Change the sum to 4 + 6, keep ** 2."
  - "It should look like: print((4 + 6) ** 2)"
