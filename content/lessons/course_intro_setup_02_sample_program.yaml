id: course_intro_setup_2
title: "Your Sample Program with Python Basics 🧭"
level: 901
objective: "Write a short program using multiple print() lines and a comment."
explanation: |
  You've seen print() show a message, and a # comment leave a note for humans.

  Real programs usually have more than one line -- Python runs each print() in order, one after another, so they show up on separate lines.

  Let's write a tiny "About Me" program using a few print() lines and one comment.
example_code: |
  # My About Me program
  print("My name is Alex")
  print("I am learning Python!")
starter_code: |
  # My About Me program
  print("My name is Alex")
  print("I am learning Python!")
challenge: |
  🎯 Challenge: Add a third print() line that says "Python is fun!" underneath the other two.
expected_output: |
  My name is Alex
  I am learning Python!
  Python is fun!
hints:
  - "Add a new line under the last print(...) -- don't remove the others."
  - "Every print() line needs its own set of quotes and round brackets."
  - "It should look like: print(\"Python is fun!\") as the third line."
reward_stars: 3
badge: null
category: course_intro_setup
category_level: 2
concept_tags: [print, comments]
