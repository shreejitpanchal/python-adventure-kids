id: lesson_128
title: "Division: Level 16 ➗"
level: 128
objective: "Divide a negative number by another negative number."
explanation: |
  A negative divided by a negative makes a positive!

  -20 / -4 is 5.0, not -5.0, because the two minus signs cancel each other out.
example_code: |
  print(-20 / -4)
starter_code: |
  print(-20 / -4)
