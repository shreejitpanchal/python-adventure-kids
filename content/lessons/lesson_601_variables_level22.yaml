id: lesson_601
title: "Variables: Level 22 📦"
level: 601
objective: "Weave two variables into the same f-string."
explanation: |
  An f-string can hold more than one variable — just give each one its own curly braces.
example_code: |
  name = "Sam"
  age = 9
  print(f"{name} is {age}")
