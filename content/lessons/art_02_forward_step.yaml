id: art_02
title: "Creative Arts: The Robot Artist 🎨"
level: 221
objective: "Use game.forward() to move and draw at the same time."
explanation: |
  Imagine a tiny robot artist standing on the canvas, facing right. game.forward(distance)
  moves it forward by that many pixels -- and it draws a line the whole way, like
  dragging a pen across paper.
example_code: |
  game.set_background("white")
  game.forward(150)
