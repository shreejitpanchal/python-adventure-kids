id: lesson_52
title: "Numbers: Level 8 🔢"
level: 52
objective: "Use round() to round a decimal to the nearest whole number."
explanation: |
  round() tidies up a decimal number to the closest whole number.

  round(7.8) becomes 8, because 7.8 is closer to 8 than to 7.
example_code: |
  print(round(7.8))
starter_code: |
  print(round(7.8))
challenge: |
  🎯 Challenge: Can you make Python round 4.2 to the nearest whole number?
expected_output: "4"
hints:
  - "Change 7.8 to 4.2 inside round(...)."
  - "It should look like: print(round(4.2))"
