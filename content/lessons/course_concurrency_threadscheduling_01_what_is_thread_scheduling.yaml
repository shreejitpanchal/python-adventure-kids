id: course_concurrency_threadscheduling_1
title: "What is Thread Scheduling? 🧵"
level: 984
objective: "Understand round-robin scheduling by simulating threads taking turns."
explanation: |
  A real operating system runs many threads by rapidly switching between them -- this is called scheduling. We can simulate a simple "round-robin" scheduler, where each thread gets one turn in order, then it's the next thread's turn.
example_code: |
  threads = {"thread-1": 3, "thread-2": 3}
  for turn in range(1, 4):
      for name in threads:
          print(name + " runs turn " + str(turn))
starter_code: |
  threads = {"thread-1": 3, "thread-2": 3}
  for turn in range(1, 4):
      for name in threads:
          print(name + " runs turn " + str(turn))
challenge: |
  🎯 Challenge: Add a third thread, "thread-3": 3, to the threads dictionary, then run it.
expected_output: |
  thread-1 runs turn 1
  thread-2 runs turn 1
  thread-3 runs turn 1
  thread-1 runs turn 2
  thread-2 runs turn 2
  thread-3 runs turn 2
  thread-1 runs turn 3
  thread-2 runs turn 3
  thread-3 runs turn 3
hints:
  - "Add \"thread-3\": 3 inside the threads dictionary."
  - "Every thread in the dictionary gets a turn each round."
  - "It should look like: threads = {\"thread-1\": 3, \"thread-2\": 3, \"thread-3\": 3}"
