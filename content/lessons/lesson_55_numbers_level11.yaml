id: lesson_55
title: "Numbers: Level 11 🔢"
level: 55
objective: "Compare two numbers with != to check if they're different."
explanation: |
  != asks "are these two numbers NOT equal?" It's the opposite of ==.

  3 != 7 is True, because 3 and 7 really are different.
example_code: |
  print(3 != 7)
starter_code: |
  print(3 != 7)
challenge: |
  🎯 Challenge: Can you make Python check if 10 is NOT equal to 10?
expected_output: "False"
hints:
  - "Change both numbers to 10."
  - "It should look like: print(10 != 10)"
