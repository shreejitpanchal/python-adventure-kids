id: ai_advanced_neuralnetworks_2
title: "Your Sample Program with Neural Networks 🕸️"
level: 2021
objective: "Combine multiple weighted inputs into one neuron's decision, like a simple perceptron."
explanation: |
  Real neurons usually take several inputs at once, each with its own weight. This adds up every input times its matching weight -- the same idea behind a real "perceptron," just with two inputs instead of hundreds.
example_code: |
  inputs = [2, 3]
  weights = [1, 2]
  total = 0
  for i in range(len(inputs)):
      total = total + inputs[i] * weights[i]
  threshold = 10
  if total >= threshold:
      print("Neuron fires! Total: " + str(total))
  else:
      print("Neuron stays quiet. Total: " + str(total))
