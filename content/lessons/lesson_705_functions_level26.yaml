id: lesson_705
title: "Functions: Level 26 ⚙️"
level: 705
objective: "Use *args to accept any number of arguments and total them."
explanation: |
  *args lets a function accept ANY number of arguments -- not a fixed amount. Inside the function, args behaves like a list, so a loop can walk through every value that got passed in, no matter how many there were.

  total(1, 2, 3) and total(1, 2, 3, 4, 5) both work with the exact same function, because *args just packs up whatever you give it.
example_code: |
  def total(*args):
      result = 0
      for n in args:
          result += n
      return result

  print(total(1, 2, 3))
starter_code: |
  def total(*args):
      result = 0
      for n in args:
          result += n
      return result

  print(total(1, 2, 3))
challenge: |
  🎯 Challenge: Can you call total with 5, 10, 15, and 20 instead, so it prints 50?
expected_output: "50"
hints:
  - "Change the numbers you pass into total(...) -- you can pass as many as you like."
  - "*args collects every number you pass in, so total(5, 10, 15, 20) still works."
  - "It should look like: print(total(5, 10, 15, 20))"
