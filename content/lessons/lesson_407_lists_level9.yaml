      if s > biggest:
          biggest = s
  print(biggest)
challenge: |
  🎯 Challenge: Can you find and print the biggest score in this backpack?
expected_output: "45"
hints:
  - "Start by assuming the first item is the biggest."
  - "Compare every item with if s > biggest: and update biggest when you find something bigger."
  - "It should look like: biggest = scores[0], then loop with if s > biggest: biggest = s, then print(biggest)"
