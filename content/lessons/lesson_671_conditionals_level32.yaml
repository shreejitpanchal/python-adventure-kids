id: lesson_671
title: "Decisions: Level 32 🚦"
level: 671
objective: "Nest an elif chain inside an if, one tier deeper than before."
explanation: |
  This nests a three-branch elif chain inside a single outer if, similar to level 26 but sorting into loyalty tiers based on points.

  Python only checks the points tiers at all once is_member == "yes" is confirmed.
example_code: |
  is_member = "yes"
  points = 150
  if is_member == "yes":
      if points >= 200:
          print("Gold tier!")
      elif points >= 100:
          print("Silver tier!")
      else:
          print("Bronze tier!")
  else:
      print("Join to start earning points!")
