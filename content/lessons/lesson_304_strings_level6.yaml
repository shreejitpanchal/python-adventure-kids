id: lesson_304
title: "Strings: Level 6 🔤"
level: 304
objective: "Convert a string to all lowercase using .lower()."
explanation: |
  loud.lower() is the opposite of .upper() — it gives you the text back with every letter turned small.

  It's handy for making shouty ALL CAPS text calm and quiet again.
example_code: |
  loud = "LOUD"
  print(loud.lower())
starter_code: |
  loud = "LOUD"
  print(loud.lower())
challenge: |
  🎯 Challenge: Change loud to "SHOUTING" and print its lowercase version.
expected_output: "shouting"
hints:
  - "Change \"LOUD\" to \"SHOUTING\", keeping the quotes."
  - ".lower() goes right after the variable name, with a dot in between."
  - "It should look like: loud = \"SHOUTING\", print(loud.lower())"
