challenge: |
  🎯 Challenge: Can you call average with 10, 20, 30, and 40 instead, so it prints 25.0?
expected_output: "25.0"
hints:
  - "Change the numbers you pass into average(...)."
  - "average(10, 20, 30, 40) adds all four numbers, then divides by 4."
  - "It should look like: print(average(10, 20, 30, 40))"
