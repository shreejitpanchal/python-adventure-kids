id: lesson_707
title: "Functions: Level 28 ⚙️"
level: 707
objective: "Pass a function's *args along into another function using *."
explanation: |
  A function that receives *args can pass those same arguments straight along to another function, by putting a * in front of args when calling it -- this unpacks the collected values back into separate arguments.

  average(*args) calls total(*args) to do the adding, then divides by how many numbers there were -- reusing one function's work inside another.
example_code: |
  def total(*args):
      result = 0
      for n in args:
          result += n
      return result

  def average(*args):
      return total(*args) / len(args)

  print(average(4, 8, 12))
starter_code: |
