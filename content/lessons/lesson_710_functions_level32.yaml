id: lesson_710
title: "Functions: Level 31 ⚙️"
level: 710
objective: "Write a recursive function that adds instead of multiplies."
explanation: |
  The same recursive shape can add instead of multiply -- sum_to(n) returns n plus the result of sum_to(n - 1), building up a total instead of a product.

  Just like factorial, the base case (n <= 0 returns 0) is what stops the chain of calls.
example_code: |
  def sum_to(n):
      if n <= 0:
          return 0
      return n + sum_to(n - 1)

  print(sum_to(4))
starter_code: |
  def sum_to(n):
      if n <= 0:
          return 0
      return n + sum_to(n - 1)

  print(sum_to(4))
challenge: |
  🎯 Challenge: Can you call sum_to with 6 instead of 4, so it prints 21?
expected_output: "21"
hints:
  - "Change the number you pass into sum_to(...)."
  - "sum_to(6) adds 6 + 5 + 4 + 3 + 2 + 1."
  - "It should look like: print(sum_to(6))"
