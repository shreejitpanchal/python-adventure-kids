id: lesson_648
title: "Ask a Question: Level 29 🙋"
level: 648
objective: "Type two numbers on one line and split them apart to add them together."
explanation: |
  input() only ever gives you back ONE line of text — but that line can hold more than one piece of information if you separate them with a space.

  line = input(...) stores the whole typed line. parts = line.split() breaks it into a list at the space. Then int(parts[0]) and int(parts[1]) turn each piece into a number you can add.
example_code: |
  line = input("Type two numbers separated by a space: ")
  parts = line.split()
  a = int(parts[0])
  b = int(parts[1])
  print(a + b)
starter_code: |
  line = input("Type two numbers separated by a space: ")
  parts = line.split()
  a = int(parts[0])
  b = int(parts[1])
  print(a + b)
challenge: |
  🎯 Challenge: Type 4 7 (with a space between them) in the box below, then press RUN to see them added together!
expected_output: "Type two numbers separated by a space: 11"
input_prompt: "Type two numbers separated by a space:"
hints:
  - "Type 4 7 in the answer box above the RUN button, with a space between the two numbers."
  - "line.split() breaks your typed text into two pieces wherever the space is."
  - "You don't need to change the code — just type 4 7 and press RUN!"
