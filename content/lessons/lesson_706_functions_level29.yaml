id: lesson_706
title: "Functions: Level 27 ⚙️"
level: 706
objective: "Use *args with a loop and if to find the biggest value among any number of arguments."
explanation: |
  *args works with any kind of loop logic, not just adding up. Here the loop compares every argument against the biggest one seen so far, updating result whenever it finds something bigger -- the same pattern as finding the biggest item in a list.

  Because it's *args, this works whether you pass in 2 numbers or 20.
example_code: |
  def biggest(*args):
      result = args[0]
      for n in args:
          if n > result:
              result = n
      return result

  print(biggest(4, 9, 2, 7))
starter_code: |
