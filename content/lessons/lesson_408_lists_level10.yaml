id: lesson_408
title: "Lists: Level 10 🎒"
level: 408
objective: "Slice out part of a list with fruits[0:2]."
explanation: |
  Slicing grabs a CHUNK of a list instead of a single item. fruits[0:2] means "start at position 0, stop before position 2" — so it grabs positions 0 and 1.

  The second number in a slice is never included, only everything up to (but not touching) it.
example_code: |
  fruits = ["apple", "banana", "orange", "grape"]
  print(fruits[0:2])
starter_code: |
  fruits = ["apple", "banana", "orange", "grape"]
  print(fruits[0:2])
challenge: |
  🎯 Challenge: Can you slice out the MIDDLE two fruits instead — positions 1 and 2?
expected_output: "['banana', 'orange']"
hints:
  - "A slice uses two numbers inside the brackets, separated by a colon."
  - "Change fruits[0:2] to fruits[1:3] to grab positions 1 and 2, stopping before position 3."
  - "It should look like: print(fruits[1:3])"
