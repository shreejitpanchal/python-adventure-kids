id: lesson_597
title: "Division: Level 33 ➗"
level: 597
objective: "Use max() to find the bigger of two division results."
explanation: |
  max() can compare the results of two divisions, not just two plain numbers.

  max(20 / 4, 12 / 3) works out both divisions first (5.0 and 4.0), then hands back the bigger one.
example_code: |
  print(max(20 / 4, 12 / 3))
starter_code: |
  print(max(20 / 4, 12 / 3))
challenge: |
  🎯 Challenge: Which is bigger: 36 / 6 or 20 / 4? Make Python find out.
expected_output: "6.0"
hints:
  - "Change the two problems to 36 / 6 and 20 / 4."
  - "It should look like: print(max(36 / 6, 20 / 4))"
