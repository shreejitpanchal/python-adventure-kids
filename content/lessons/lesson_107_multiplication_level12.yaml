id: lesson_107
title: "Multiplication: Level 12 ✖️"
level: 107
objective: "Compare two different products and find the bigger one."
explanation: |
  max() can compare the results of two multiplications, not just two plain numbers.

  max(3 * 3, 2 * 5) works out both products first (9 and 10), then hands back the bigger one.
example_code: |
  print(max(3 * 3, 2 * 5))
starter_code: |
  print(max(3 * 3, 2 * 5))
challenge: |
  🎯 Challenge: Which is bigger: 4 * 4 or 3 * 6? Make Python find out.
expected_output: "18"
hints:
  - "Change the two problems to 4 * 4 and 3 * 6."
  - "It should look like: print(max(4 * 4, 3 * 6))"
