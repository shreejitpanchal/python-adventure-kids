id: rpg_03
title: "RPG Quest: What's on Top? ⚔️"
level: 242
objective: "Use indexing to check a specific item in a list."
explanation: |
  Just like with strings, inventory[0] gets the first item in a list --
  counting starts at 0, not 1.
example_code: |
  inventory = ["map", "potion", "sword"]
  print(inventory[0])
starter_code: |
  inventory = ["map", "potion", "sword"]
  print(inventory)
challenge: |
  🎯 Print just the FIRST item in your inventory, not the whole list.
expected_output: "map"
hints:
  - "inventory[0] gets the first item -- position 0, not 1."
  - "Replace print(inventory) with print(inventory[0])."
  - "It should look like: print(inventory[0])"
