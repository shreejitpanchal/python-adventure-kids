id: course_concurrency_observability_1
title: "What is Observability? 🔭"
level: 990
objective: "Understand observability as being able to see what a program is doing while it runs."
explanation: |
  Observability means being able to understand what your program is doing while it runs -- often by printing helpful messages at key moments.
example_code: |
  def process_order(order_id):
      print("Starting order " + str(order_id))
      total = order_id * 10
      print("Order " + str(order_id) + " total: " + str(total))
      return total

  process_order(3)
starter_code: |
