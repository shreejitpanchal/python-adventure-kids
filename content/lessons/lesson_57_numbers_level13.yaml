id: lesson_57
title: "Numbers: Level 13 🔢"
level: 57
objective: "Use min() to find the smaller of two numbers."
explanation: |
  min() is the opposite of max() — it hands you back whichever number is smaller.

  min(4, 9) is 4, because 4 is the smaller of the two.
example_code: |
  print(min(4, 9))
starter_code: |
  print(min(4, 9))
challenge: |
  🎯 Challenge: Can you make Python print the smaller of 31 and 19?
expected_output: "19"
hints:
  - "Change the numbers to 31 and 19."
  - "It should look like: print(min(31, 19))"
