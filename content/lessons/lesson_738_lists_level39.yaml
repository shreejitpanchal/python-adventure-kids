challenge: |
  🎯 Challenge: Can you call top_scores with [88, 45, 72, 90, 33, 67] and a cutoff of 50 instead, so it prints [67, 72, 88, 90]?
expected_output: "[67, 72, 88, 90]"
hints:
  - "Change both the list and the cutoff number you pass into top_scores(...)."
  - "Only scores 50 or higher make it through the filter: 88, 72, 90, and 67."
  - "It should look like: print(top_scores([88, 45, 72, 90, 33, 67], 50))"
