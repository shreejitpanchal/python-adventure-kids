id: lesson_738
title: "Lists: Level 39 🎒"
level: 738
objective: "Write a function combining a filtering comprehension with sorted() and a cutoff parameter."
explanation: |
  A function can combine a comprehension's if-filter with sorted(...), taking both a list and a cutoff number as parameters. top_scores(scores, cutoff) keeps only the scores at or above cutoff, then returns them in sorted order.

  Changing either the list or the cutoff changes what comes back, without touching the function itself.
example_code: |
  def top_scores(scores, cutoff):
      passing = [s for s in scores if s >= cutoff]
      return sorted(passing)

  print(top_scores([55, 92, 78, 61, 40], 60))
starter_code: |
