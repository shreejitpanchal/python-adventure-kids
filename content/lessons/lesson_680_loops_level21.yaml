id: lesson_680
title: "Loops: Level 21 🔁"
level: 680
objective: "Skip one specific number in a loop using continue."
explanation: |
  continue does something different from break -- instead of stopping the loop completely, it just skips the rest of THIS trip around and jumps straight to the next one.

  if i == 4: continue means "when i is 4, skip printing it, but keep looping for every other number".
example_code: |
  for i in range(1, 8):
      if i == 4:
          continue
      print(i)
starter_code: |
  for i in range(1, 8):
      if i == 4:
          continue
      print(i)
challenge: |
  🎯 Challenge: Can you make it skip the number 6 instead of 4?
expected_output: |
  1
  2
  3
  4
  5
  7
hints:
  - "Change if i == 4: to if i == 6:."
  - "continue jumps straight to the next number without printing the current one."
  - "The loop still runs range(1, 8) -- only the skipped number changes."
