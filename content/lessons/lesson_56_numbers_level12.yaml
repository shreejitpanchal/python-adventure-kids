id: lesson_56
title: "Numbers: Level 12 🔢"
level: 56
objective: "Use max() to find the bigger of two numbers."
explanation: |
  max() looks at two numbers and hands you back whichever one is bigger.

  max(4, 9) is 9, because 9 is the bigger of the two.
example_code: |
  print(max(4, 9))
starter_code: |
  print(max(4, 9))
challenge: |
  🎯 Challenge: Can you make Python print the bigger of 23 and 17?
expected_output: "23"
hints:
