id: lesson_640
title: "Ask a Question: Level 21 🙋"
level: 640
objective: "Use round() to round a division result to one decimal place."
explanation: |
  Dividing numbers can give you long decimal answers. round(number, 1) rounds the answer to just 1 digit after the decimal point.

  n = int(input("Type a number: ")) stores your number. print(round(n / 3, 1)) divides it by 3 and rounds the answer.
example_code: |
  n = int(input("Type a number: "))
  print(round(n / 3, 1))
starter_code: |
  n = int(input("Type a number: "))
  print(round(n / 3, 1))
challenge: |
  🎯 Challenge: Type the number 7 in the box below, then press RUN to see it divided by 3 and rounded!
expected_output: "Type a number: 2.3"
input_prompt: "Type a number:"
hints:
  - "Type 7 in the answer box above the RUN button."
  - "round(number, 1) keeps just 1 digit after the decimal point."
  - "You don't need to change the code — just type 7 and press RUN!"
