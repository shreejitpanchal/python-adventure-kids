id: lesson_410
title: "Lists: Level 12 🎒"
level: 410
objective: "Join a list of strings into one string with .join(...)."
explanation: |
  .join(...) glues every item in a list together into a single string, with whatever you put in front of the dot placed BETWEEN each item.

  ", ".join(fruits) glues the fruits together with a comma and a space in between, turning the whole list into one readable sentence.
example_code: |
  fruits = ["apple", "banana", "orange"]
  print(", ".join(fruits))
starter_code: |
  fruits = ["apple", "banana", "orange"]
  print(", ".join(fruits))
challenge: |
  🎯 Challenge: Can you change the backpack to ["sun", "moon", "stars"] and join every item into one string, separated by ", "?
expected_output: "sun, moon, stars"
hints:
  - "Change fruits = [...] to the new list of three items."
  - ".join(...) doesn't need to change — it still glues the list together with \", \" in between."
  - "It should look like: fruits = [\"sun\", \"moon\", \"stars\"], then print(\", \".join(fruits))"
