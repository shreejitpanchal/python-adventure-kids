id: lesson_451
title: "Project: Introduction Card 🪪"
level: 451
objective: "Combine print(), strings, numbers, and a comment into one finished mini-project."
explanation: |
  This is your first Python Journey project — time to put everything from Python Starter
  together into one program: an introduction card, all about YOU (or a made-up character!).

  You've already used print() for text, and you know numbers don't need quotes around
  them. Now combine several print() lines into one card, with a comment explaining
  what one of the lines does.
example_code: |
  print("=====================")
  print("MEET AVYAAN THE CODER")
  print("=====================")
  # Favorite number, just for fun
  favorite_number = 7
  print("Favorite number:", favorite_number)
  print("Loves: Python, games, and pizza!")
starter_code: |
  print("=====================")
  print("MEET AVYAAN THE CODER")
  print("=====================")
  # Favorite number, just for fun
  favorite_number = 7
  print("Favorite number:", favorite_number)
  print("Loves: Python, games, and pizza!")
challenge: |
  🎯 Challenge: Change favorite_number to 42, and change the last line to say
  "Loves: Python, games, and swimming!" instead of pizza.
expected_output: |
  =====================
  MEET AVYAAN THE CODER
  =====================
  Favorite number: 42
  Loves: Python, games, and swimming!
ast_contains: ["print"]
hints:
  - "print(\"Favorite number:\", favorite_number) — a comma lets print() show text AND a number together."
  - "Change favorite_number = 7 to favorite_number = 42."
  - "Change the last print() line's text to end with \"...and swimming!\" instead of \"...and pizza!\"."
