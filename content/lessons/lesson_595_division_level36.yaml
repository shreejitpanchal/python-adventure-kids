challenge: |
  🎯 Challenge: Divide -17 by 6, then by -1, then round the result to 2 decimal places.
expected_output: "2.83"
hints:
  - "Change the numbers to -17, 6, -1, and the digit count to 2."
  - "Two negatives in the chain cancel out before rounding."
  - "It should look like: print(round(-17 / 6 / -1, 2))"
