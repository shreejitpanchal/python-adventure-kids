title: "Division: Level 36 ➗"
level: 595
objective: "Round the result of a negative, decimal division chain to a set number of digits."
explanation: |
  You can combine everything you know: chain a negative and a decimal division together, then round to a set number of digits.
example_code: |
  print(round(-22 / 7 / -1, 3))
starter_code: |
