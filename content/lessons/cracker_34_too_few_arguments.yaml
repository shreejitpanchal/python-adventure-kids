id: cracker_34
title: "Code Cracker: Not Enough Information 🧩"
level: 469
objective: "Fix a TypeError caused by calling a function with too few arguments."
explanation: |
  A function that expects two pieces of information, like a and
  b, needs both of them every time it's called. Leaving one out
  crashes with a TypeError about a missing argument.
example_code: |
  def add_numbers(a, b):
      return a + b

  print(add_numbers(3, 4))
starter_code: |
  def add_numbers(a, b):
      return a + b

  print(add_numbers(3))
challenge: |
  🎯 This code won't run! add_numbers needs two arguments -- only one was given.
expected_output: "7"
ast_contains: ["def", "return", "print"]
hints:
  - "add_numbers(a, b) expects two pieces of information."
  - "Only one number was given when it was called -- b is missing."
  - "It should look like: add_numbers(3, 4)"
