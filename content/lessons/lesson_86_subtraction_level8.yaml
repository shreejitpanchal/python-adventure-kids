id: lesson_86
title: "Subtraction: Level 8 ➖"
level: 86
objective: "Subtract two numbers, then find the absolute value of the result."
explanation: |
  abs() can wrap around a subtraction too — Python works out the difference first, then strips away any minus sign.

  abs(3 - 10) subtracts first (getting -7), then shows how far -7 is from zero: 7.
example_code: |
  print(abs(3 - 10))
starter_code: |
  print(abs(3 - 10))
challenge: |
  🎯 Challenge: Subtract 25 from 6, then find the absolute value of the result.
expected_output: "19"
hints:
  - "Change the numbers to 6 and 25."
  - "It should look like: print(abs(6 - 25))"
