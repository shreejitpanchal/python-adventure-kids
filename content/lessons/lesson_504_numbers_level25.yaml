objective: "Check whether a floor-division result equals a target number."
explanation: |
  You can compare the result of // just like any other calculation.

  17 // 5 == 3 first works out 17 // 5 (which is 3), then checks if that equals 3.
example_code: |
  print(17 // 5 == 3)
starter_code: |
