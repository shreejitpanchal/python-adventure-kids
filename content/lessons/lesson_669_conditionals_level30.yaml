id: lesson_669
title: "Decisions: Level 30 🚦"
level: 669
objective: "Use a conditional expression directly inside a print() call."
explanation: |
  A conditional expression doesn't need to be saved in a variable first — you can put it straight inside print().

  print("Warm" if temperature >= 60 else "Cold") decides which word to print, all in one line.
example_code: |
  temperature = 40
  print("Warm" if temperature >= 60 else "Cold")
starter_code: |
  temperature = 40
  print("Warm" if temperature >= 60 else "Cold")
challenge: |
  🎯 Challenge: Change temperature so Python prints "Warm" instead.
expected_output: "Warm"
hints:
  - "temperature needs to be 60 or more for \"Warm\" to be chosen."
  - "The whole if/else lives right inside the print(...) parentheses."
  - "Try temperature = 70."
