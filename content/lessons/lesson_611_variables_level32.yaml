id: lesson_611
title: "Variables: Level 32 📦"
level: 611
objective: "Round a variable's value to a specific number of decimal digits."
explanation: |
  round(pi, 2) works on a variable just like it works on a plain number — the second number controls how many digits are kept.
example_code: |
  pi = 3.14159
  print(round(pi, 2))
starter_code: |
  pi = 3.14159
  print(round(pi, 2))
challenge: |
  🎯 Challenge: Store 2.71828 in a variable called e, and print it rounded to 3 decimal places.
expected_output: "2.718"
hints:
  - "Change pi to e = 2.71828, then round(e, 3)."
  - "It should look like: e = 2.71828, print(round(e, 3))"
