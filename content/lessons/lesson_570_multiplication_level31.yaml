id: lesson_570
title: "Multiplication: Level 31 ✖️"
level: 570
objective: "Use parentheses to force addition to happen before multiplication."
explanation: |
  Parentheses run first, before anything else — they let you override the normal order of operations.

  print((2 + 3) * 4) adds 2 and 3 first (5), then multiplies by 4 — giving 20, not 14.
example_code: |
  print((2 + 3) * 4)
starter_code: |
  print((2 + 3) * 4)
challenge: |
  🎯 Challenge: Add 6 and 4 together first, then multiply the result by 5.
expected_output: "50"
hints:
  - "Change the numbers to 6, 4, and 5, keeping the parentheses."
  - "The parentheses force the addition to happen first."
  - "It should look like: print((6 + 4) * 5)"
