id: lesson_405
title: "Lists: Level 7 🎒"
level: 405
objective: "Loop over a list using its index positions with range(len(...))."
explanation: |
  Sometimes you want both the position AND the item while looping. range(len(letters)) counts from 0 up to (but not including) the list's length, giving you every valid index.

  Then letters[i] uses that index to grab each item, so you can print the position and the value together.
example_code: |
  letters = ["a", "b", "c"]
  for i in range(len(letters)):
      print(i, letters[i])
starter_code: |
  letters = ["a", "b", "c"]
  for i in range(len(letters)):
      print(i, letters[i])
challenge: |
  🎯 Challenge: Can you change the backpack to ["x", "y", "z", "w"] and print each letter's position number next to the letter itself?
expected_output: |
  0 x
  1 y
  2 z
  3 w
hints:
  - "Change letters = [...] to the new list of four letters."
  - "range(len(letters)) and letters[i] don't need to change — they work for any list."
  - "It should look like: letters = [\"x\", \"y\", \"z\", \"w\"], then for i in range(len(letters)): print(i, letters[i])"
