id: lesson_315
title: "Strings: Level 17 🔤"
level: 315
objective: "Check the start and end of a string with .startswith() and .endswith()."
explanation: |
  word.startswith("rock") checks whether word begins with those exact letters, and gives back True or False.

  word.endswith("cket") does the same thing, but checks the end of the string instead of the beginning.
example_code: |
  word = "rocket"
  print(word.startswith("rock"))
  print(word.endswith("cket"))
starter_code: |
  word = "rocket"
  print(word.startswith("rock"))
  print(word.endswith("cket"))
challenge: |
  🎯 Challenge: Change word to "sunshine". Check if it starts with "sun" and if it ends with "rise".
expected_output: |
  True
  False
hints:
  - "Change word to \"sunshine\", and change the two checks to \"sun\" and \"rise\"."
  - "\"sunshine\" really does start with \"sun\" — but it ends with \"shine\", not \"rise\"."
  - "It should look like: word = \"sunshine\", print(word.startswith(\"sun\")), print(word.endswith(\"rise\"))"
