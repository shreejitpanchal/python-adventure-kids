      game.turn_right(72)
challenge: |
  🎯 Challenge: Press RUN to see a pentagon! Then work out the angle for a
  hexagon (6 sides) yourself and try it.
expected_output: ""
ast_contains: ["for", "forward", "turn_right"]
hints:
  - "360 divided by the number of sides gives the turn angle."
  - "For 6 sides: 360 / 6 = 60 degrees."
  - "Change both range(5) to range(6) AND turn_right(72) to turn_right(60) together."
