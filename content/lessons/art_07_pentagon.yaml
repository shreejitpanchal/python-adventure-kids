id: art_07
title: "Creative Arts: The Five-Sided Shape 🎨"
level: 226
objective: "Draw a pentagon by working out the right turn angle."
explanation: |
  A full turn all the way around is 360 degrees. To draw a shape with equal
  sides that closes up perfectly, split 360 evenly by the number of sides:
  a square turns 360 / 4 = 90 degrees each time, so a pentagon (5 sides)
  turns 360 / 5 = 72 degrees each time.
example_code: |
  game.set_background("white")
  for i in range(5):
      game.forward(80)
      game.turn_right(72)
starter_code: |
  game.set_background("white")
