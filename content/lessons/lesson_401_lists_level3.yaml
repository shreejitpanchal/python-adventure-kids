id: lesson_401
title: "Lists: Level 3 🎒"
level: 401
objective: "Use negative indexing to grab the last item in a list."
explanation: |
  Python lets you count from the END of a list too, using negative numbers. snacks[-1] means "the last item", no matter how long the list is.

  snacks[-2] would be the SECOND-to-last item. Negative indexing is a handy shortcut so you don't have to count how many items are in the list first.
example_code: |
  snacks = ["chips", "pretzels", "popcorn"]
  print(snacks[-1])
starter_code: |
  snacks = ["chips", "pretzels", "popcorn"]
  print(snacks[-1])
challenge: |
  🎯 Challenge: Can you print the SECOND-TO-LAST snack in the backpack instead, using negative indexing?
expected_output: "pretzels"
hints:
  - "Negative indexing counts backward from the end of the list."
  - "snacks[-2] means the second-to-last item, no matter the list's length."
  - "It should look like: print(snacks[-2])"
