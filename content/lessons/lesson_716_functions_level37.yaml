id: lesson_716
title: "Functions: Level 37 ⚙️"
level: 716
objective: "Combine recursion with *args to total any number of arguments."
explanation: |
  A recursive function can accept *args too — it just peels off one argument at a time and calls itself with the rest.

  total_of(*nums) checks if there are any numbers left; if not, it returns 0. Otherwise it adds the first number to the result of calling itself on all the rest.
example_code: |
  def total_of(*nums):
      if len(nums) == 0:
          return 0
      return nums[0] + total_of(*nums[1:])

  print(total_of(2, 4, 6, 8))
starter_code: |
