challenge: |
  🎯 Challenge: Can you call divide with 23 and 4 instead, so it prints the correct quotient and remainder?
expected_output: |
  5
  3
hints:
  - "Change the numbers you pass into divide(...)."
  - "23 // 4 is the quotient, and 23 % 4 is the remainder."
  - "It should look like: divide(23, 4)"
