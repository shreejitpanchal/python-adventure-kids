id: lesson_703
title: "Functions: Level 24 ⚙️"
level: 703
objective: "Return a quotient and remainder as a tuple using // and %."
explanation: |
  // is floor division -- it divides two numbers and throws away any leftover, keeping just the whole-number answer. % gives you that leftover on its own. Together, they split a division into two useful pieces.

  divide(a, b) returns both the quotient and the remainder as a tuple, exactly like doing long division by hand.
example_code: |
  def divide(a, b):
      quotient = a // b
      remainder = a % b
      return quotient, remainder

  q, r = divide(17, 5)
  print(q)
  print(r)
starter_code: |
