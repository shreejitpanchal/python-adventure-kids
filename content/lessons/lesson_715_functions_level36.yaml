challenge: |
  🎯 Challenge: Can you call show_stats with 10, 20, and 30 instead, so it prints Sum: 60 and Average: 20.0?
expected_output: |
  Sum: 60
  Average: 20.0
hints:
  - "Change the numbers you pass into show_stats(...)."
  - "show_stats(10, 20, 30) adds all three numbers and divides by 3 for the average."
  - "It should look like: show_stats(10, 20, 30)"
