id: lesson_715
title: "Functions: Level 36 ⚙️"
level: 715
objective: "Call a *args function from another function that also uses *args, unpacking a tuple return."
explanation: |
  Functions can combine everything so far: *args, calling one function from another, and returning a tuple. stats(*args) returns both a total and an average as a tuple; show_stats(*args) calls it and unpacks both values to print them.

  Passing *args along from show_stats into stats means both functions accept any number of numbers.
example_code: |
  def stats(*args):
      total = 0
      for n in args:
          total += n
      return total, total / len(args)

  def show_stats(*args):
      s, avg = stats(*args)
      print("Sum:", s)
      print("Average:", avg)

  show_stats(2, 4, 6, 8)
