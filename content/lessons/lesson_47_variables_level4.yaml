id: lesson_47
title: "Variables: Level 20 📦"
level: 47
objective: "Combine everything you've learned about variables in one program."
explanation: |
  You've learned a lot about boxes: text, numbers, +=, and printing several at once. This last challenge mixes them all together.
example_code: |
  name = "Explorer"
  score = 0
  score += 10
  score += 5
  print(name, score)
