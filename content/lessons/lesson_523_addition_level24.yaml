id: lesson_523
title: "Addition: Level 24 ➕"
level: 523
objective: "Use an f-string to show the result of an addition inside a sentence."
explanation: |
  An f-string lets you drop a calculation right inside text -- put an f right before the quotes, and wrap the calculation in curly braces {}.

  f"Total: {3 + 4}" shows the words "Total: " followed by the answer, 7.
example_code: |
  print(f"Total: {3 + 4}")
starter_code: |
  print(f"Total: {3 + 4}")
challenge: |
  🎯 Challenge: Can you make Python print "Total: " followed by 12 + 9?
expected_output: "Total: 21"
hints:
  - "Change 3 + 4 to 12 + 9, inside the curly braces."
  - "Keep the f right before the quotes, and the curly braces {} around the math."
  - "It should look like: print(f\"Total: {12 + 9}\")"
