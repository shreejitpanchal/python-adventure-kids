id: lesson_442
title: "Robot Adventure: Watch Out! 🤖"
level: 442
objective: "Route the robot around an obstacle using multiple turns."
explanation: |
  game.place_obstacle(1, 1) puts a gray block right in the robot's path. The robot can't
  drive through it — game.robot_forward() simply won't move if something's blocking the way.

  To get past it, the robot needs to go around: up and over, then back down on the other side.
example_code: |
  game.set_background("black")
  game.create_grid(3, 3)
  game.place_obstacle(1, 1)
  game.place_goal(2, 1)
  game.place_robot(0, 1, "E")
  game.robot_turn_left()
  game.robot_forward()
  game.robot_turn_right()
  game.robot_forward()
  game.robot_forward()
  game.robot_turn_right()
  game.robot_forward()
starter_code: |
