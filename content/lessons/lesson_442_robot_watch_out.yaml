challenge: |
  🎯 Challenge: Press RUN and watch the robot detour around the gray obstacle to reach the goal!
expected_output: ""
ast_contains: ["place_obstacle", "robot_turn_left", "robot_turn_right", "robot_forward"]
requires_goal_reached: true
hints:
  - "The obstacle blocks the straight path — the robot goes up, across, then back down."
  - "game.robot_forward() does nothing if the way is blocked — it won't crash, it just won't move."
  - "Trace the turns on paper first: left, forward, right, forward, forward, right, forward."
