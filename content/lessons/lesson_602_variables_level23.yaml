id: lesson_602
title: "Variables: Level 23 📦"
level: 602
objective: "Put a math expression, not just a variable name, inside an f-string's curly braces."
explanation: |
  You can put a full expression inside {}, not just a bare variable — Python works it out before dropping it into the text.
example_code: |
  price = 5
  print(f"Total: {price + 2}")
starter_code: |
  price = 5
