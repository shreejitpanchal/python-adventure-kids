challenge: |
  🎯 Challenge: Store 12 in price, then print an f-string showing "Total: 15" using price + 3.
expected_output: "Total: 15"
hints:
  - "Change price to 12, and 2 to 3 inside the braces."
  - "It should look like: price = 12, print(f\"Total: {price + 3}\")"
