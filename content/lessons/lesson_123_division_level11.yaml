id: lesson_123
title: "Division: Level 11 ➗"
level: 123
objective: "Use % to find the remainder left over after dividing."
explanation: |
  % is called modulo — it tells you what's left over after dividing as many whole times as possible.

  17 % 5 is 2, because 5 goes into 17 three times (15), leaving 2 left over.
example_code: |
  print(17 % 5)
starter_code: |
  print(17 % 5)
challenge: |
  🎯 Challenge: What's left over when 23 is divided by 5? Use % to find out.
expected_output: "3"
hints:
