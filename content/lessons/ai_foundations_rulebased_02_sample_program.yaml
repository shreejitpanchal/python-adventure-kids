id: ai_foundations_rulebased_2
title: "Your Sample Program with Rule-Based Decisions 💬"
level: 2005
objective: "Build a simple rule-based chatbot that matches keywords in a message to a canned reply."
explanation: |
  A simple chatbot is just a rule-based system applied to words: check the message for a keyword, and reply accordingly. Real chatbots are more complex, but the core idea -- match input to a response using rules -- is the same one.
example_code: |
  message = "hello there"
  message = message.lower()
  if "hello" in message:
      print("Hi there! I'm a simple rule-based chatbot.")
  elif "weather" in message:
      print("I can't check the weather, but I hope it's nice!")
  elif "name" in message:
      print("I'm RoboBot, a rule-based chatbot!")
  else:
      print("I don't understand yet, but I'm still learning!")
starter_code: |
