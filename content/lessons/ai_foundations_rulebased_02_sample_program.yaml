challenge: |
  🎯 Challenge: Change message to "what's your name?", then run it.
expected_output: |
  I'm RoboBot, a rule-based chatbot!
hints:
  - "Change the text inside the quotes after message ="
  - "\"name\" appears inside \"what's your name?\", so the elif \"name\" in message: rule matches."
  - "It should look like: message = \"what's your name?\""
