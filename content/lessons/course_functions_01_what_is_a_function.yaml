id: course_functions_1
title: "What is a Function? 🧰"
level: 909
objective: "Define a function with no inputs and call it."
explanation: |
  A function is a little machine you can build once and use again and again.

  def greet(): builds a machine named greet. greet() switches the machine on and runs what's inside it.
example_code: |
  def greet():
      print("Hello!")

  greet()
starter_code: |
  def greet():
      print("Hello!")

  greet()
challenge: |
  🎯 Challenge: Change "Hello!" to "Howdy!", then run it.
expected_output: "Howdy!"
hints:
  - "Only change the text inside the quotes."
  - "Don't change def greet(): or the greet() call at the bottom."
  - "It should look like: print(\"Howdy!\")"
reward_stars: 2
badge: null
category: course_functions
category_level: 1
topic: Defining Functions
concept_tags: [functions]
