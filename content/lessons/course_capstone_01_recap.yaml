id: course_capstone_1
title: "Recap: Building Bigger Programs 🏁"
level: 924
objective: "Combine variables, lists, functions, and if/else into one program before building the To-Do app."
explanation: |
  You've now learned variables, control flow, functions, and lists -- everything you need to build a real program.

  Real programs combine these building blocks: a function can use an if/else, and that if/else can check a list.

  In this chapter's sample program, you'll build a small To-Do app. First, let's see how a function and a conditional work together to describe a list.
example_code: |
  tasks = ["Buy milk", "Walk the dog"]

  def show_tasks(tasks):
      if len(tasks) == 0:
          print("No tasks yet!")
      else:
          for task in tasks:
              print("- " + task)

  show_tasks(tasks)
