challenge: |
  🎯 Challenge: Change tasks to an empty list [] so the program takes the other path, then run it.
expected_output: "No tasks yet!"
hints:
  - "Change tasks = [\"Buy milk\", \"Walk the dog\"] to tasks = []"
  - "Don't change anything inside show_tasks -- the if/else already handles an empty list."
  - "It should look like: tasks = []"
