id: lesson_329
title: "Ask a Question: Level 11 🙋"
level: 329
objective: "Use % to find the remainder when a typed number is divided by 3."
explanation: |
  % is called the modulo operator. It divides two numbers and gives back only the leftover amount, not the answer itself.

  n = int(input("Type a number: ")) stores your number. print(n % 3) shows what's left over after dividing n by 3 as many whole times as possible.
example_code: |
  n = int(input("Type a number: "))
  print(n % 3)
starter_code: |
  n = int(input("Type a number: "))
  print(n % 3)
challenge: |
  🎯 Challenge: Type the number 10 in the box below, then press RUN to see the leftover after dividing by 3!
expected_output: "Type a number: 1"
input_prompt: "Type a number:"
hints:
  - "Type 10 in the answer box above the RUN button."
  - "% gives you the leftover after dividing — 10 split into groups of 3 leaves 1 behind."
  - "You don't need to change the code — just type 10 and press RUN!"
