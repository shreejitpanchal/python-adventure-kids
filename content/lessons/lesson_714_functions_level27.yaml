              result.append(n)
      return result

  print(filter_above([3, 8, 15, 6, 20], 7))
challenge: |
  🎯 Challenge: Can you call filter_above with [12, 4, 30, 7, 18] and 10 instead, so it prints [12, 30, 18]?
expected_output: "[12, 30, 18]"
hints:
  - "Change both the list and the number you pass into filter_above(...)."
  - "Only numbers bigger than 10 make it into the result: 12, 30, and 18."
  - "It should look like: print(filter_above([12, 4, 30, 7, 18], 10))"
