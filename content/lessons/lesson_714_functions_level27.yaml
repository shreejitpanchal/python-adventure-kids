id: lesson_714
title: "Functions: Level 35 ⚙️"
level: 714
objective: "Write a function that filters a list of numbers by a threshold parameter and returns the result."
explanation: |
  A function can combine a list parameter with another parameter that controls how it's filtered. filter_above(numbers, threshold) loops through numbers and only keeps the ones bigger than threshold.

  Changing either the list or the threshold changes what gets returned, without changing the function itself.
example_code: |
  def filter_above(numbers, threshold):
      result = []
      for n in numbers:
          if n > threshold:
              result.append(n)
      return result

  print(filter_above([3, 8, 15, 6, 20], 7))
starter_code: |
  def filter_above(numbers, threshold):
