id: lesson_340
title: "Decisions: Level 2 🚦"
level: 340
objective: "Use if/elif/else to choose between three different outcomes."
explanation: |
  Sometimes there are more than two choices. elif (short for "else if") lets Python check a second condition if the first one was false.

  Python checks each condition in order, top to bottom. The first one that's true wins, and the rest are skipped.

  If none of the if or elif conditions are true, the else at the bottom runs instead.
example_code: |
  score = 55
  if score >= 90:
      print("Excellent!")
  elif score >= 70:
      print("Good job!")
  else:
      print("Keep practicing!")
