id: lesson_388
title: "Functions: Level 10 ⚙️"
level: 388
objective: "Return different values depending on a condition."
explanation: |
  return doesn't have to happen only once at the end of a function. You can put a return inside an if and a different return inside its else, so the function hands back a different answer depending on what happened.

  grade(score) returns "Pass" when the score is high enough, or "Fail" otherwise -- the caller just prints whichever one comes back.
example_code: |
  def grade(score):
      if score >= 50:
          return "Pass"
      else:
          return "Fail"

  print(grade(40))
starter_code: |
