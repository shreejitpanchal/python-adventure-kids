challenge: |
  🎯 Challenge: Type a number between 1 and 10 in the box below, then press RUN to see if you guessed Python's secret number!
expected_output_pattern: "^Guess a number between 1 and 10: (You got it!|Not quite! The number was \\d+)$"
input_prompt: "Guess a number between 1 and 10:"
hints:
  - "Type any whole number from 1 to 10 in the answer box."
  - "random.randint(1, 10) means Python secretly picks a number from 1 to 10."
  - "Don't worry if you don't guess right — press RUN again for a brand new secret number!"
