title: "Multiplication: Level 5 ✖️"
level: 100
objective: "Multiply a number by a negative number."
explanation: |
  Multiplying by a negative number flips the sign of the answer.

  5 * -3 is -15, because a positive times a negative is negative.
example_code: |
  print(5 * -3)
