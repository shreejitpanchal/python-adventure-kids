challenge: |
  🎯 Challenge: Can you call repeat_word with "Hop" and 4, so it prints "Hop Hop Hop Hop"?
expected_output: "Hop Hop Hop Hop"
hints:
  - "Change both values you pass into repeat_word(...)."
  - "The first box is the word, the second box is how many times."
  - "It should look like: print(repeat_word(\"Hop\", 4))"
