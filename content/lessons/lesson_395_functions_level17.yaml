id: lesson_395
title: "Functions: Level 17 ⚙️"
level: 395
objective: "Combine a string parameter and a numeric parameter inside a function."
explanation: |
  A function can mix parameter types together -- one box holding words, another box holding a number -- and use them both to build its answer, like repeating a word a certain number of times.

  repeat_word(word, times) builds up a string by adding word onto result inside a loop that runs times times.
example_code: |
  def repeat_word(word, times):
      result = ""
      for i in range(times):
          result += word + " "
      return result

  print(repeat_word("Go", 3))
starter_code: |
