id: lesson_651
title: "Ask a Question: Level 32 🙋"
level: 651
objective: "Split typed length and width apart and multiply them to find an area."
explanation: |
  This is the same split-and-convert trick, but now the two numbers feed straight into a math expression inside an f-string.

  length = int(parts[0]) and width = int(parts[1]) store the two numbers. print(f"Area: {length * width}") multiplies them inside the braces.
example_code: |
  line = input("Type the length and width separated by a space: ")
  parts = line.split()
  length = int(parts[0])
  width = int(parts[1])
  print(f"Area: {length * width}")
starter_code: |
