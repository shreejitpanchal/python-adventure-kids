id: lesson_521
title: "Addition: Level 22 ➕"
level: 521
objective: "Add two numbers, then floor-divide the result."
explanation: |
  You can combine + and // -- Python adds first, then floor-divides that answer.

  (10 + 15) // 4 adds first (getting 25), then floor-divides by 4: 6.
example_code: |
  print((10 + 15) // 4)
starter_code: |
  print((10 + 15) // 4)
challenge: |
  🎯 Challenge: Add 18 and 24, then floor-divide the result by 5.
expected_output: "8"
hints:
  - "Change the numbers to 18, 24, and 5."
  - "The parentheses make sure the addition happens first."
  - "It should look like: print((18 + 24) // 5)"
