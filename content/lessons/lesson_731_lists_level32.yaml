id: lesson_731
title: "Lists: Level 32 🎒"
level: 731
objective: "Use enumerate() with a start value so counting begins somewhere other than 0."
explanation: |
  enumerate(...) can take a second argument, start=..., to begin counting from a different number -- handy for numbering things the way a person would, starting from 1 instead of 0.

  enumerate(tasks, start=1) still walks through every item in order, but the first number handed back is 1, not 0.
example_code: |
  tasks = ["wake up", "eat breakfast", "brush teeth"]
  for number, task in enumerate(tasks, start=1):
      print(number, task)
starter_code: |
  tasks = ["wake up", "eat breakfast", "brush teeth"]
  for number, task in enumerate(tasks, start=1):
      print(number, task)
challenge: |
  🎯 Challenge: Can you change tasks to ["pack bag", "tie shoes", "go to school", "say bye"] and print each one numbered from 1?
expected_output: |
  1 pack bag
  2 tie shoes
  3 go to school
  4 say bye
hints:
  - "Change tasks = [...] to the new list of four tasks."
  - "enumerate(tasks, start=1) doesn't need to change -- it already numbers any list starting at 1."
  - "It should print 1 pack bag, 2 tie shoes, 3 go to school, then 4 say bye."
