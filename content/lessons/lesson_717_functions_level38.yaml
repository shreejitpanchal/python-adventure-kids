challenge: |
  🎯 Challenge: Can you call count_even_odd with [10, 15, 20, 25, 30, 35, 40, 45] instead, so it prints Evens: 4 and Odds: 4?
expected_output: |
  Evens: 4
  Odds: 4
hints:
