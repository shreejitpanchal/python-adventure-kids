id: lesson_717
title: "Functions: Level 38 ⚙️"
level: 717
objective: "Build a tuple from inside a loop and return both values together."
explanation: |
  A function can add up more than one running total inside the same loop, then hand back both as a tuple.

  sum_and_count(nums) keeps a running total and a running count as it loops through nums, then returns both together.
example_code: |
  def sum_and_count(nums):
      total = 0
      count = 0
      for n in nums:
          total += n
          count += 1
      return total, count

  s, c = sum_and_count([3, 5, 7, 9])
  print(s, c)
