id: lesson_717
title: "Functions: Level 38 ⚙️"
level: 717
objective: "Return two counts from a function as a tuple, built up by a loop with two accumulators."
explanation: |
  A function can keep two separate running totals inside the same loop, then return both of them together as a tuple. count_even_odd(numbers) tallies how many items are even and how many are odd in a single pass.

  e, o = count_even_odd(...) unpacks both counts at once, ready to print or use however the caller needs.
example_code: |
  def count_even_odd(numbers):
      evens = 0
      odds = 0
      for n in numbers:
          if n % 2 == 0:
              evens += 1
          else:
              odds += 1
      return evens, odds

  e, o = count_even_odd([1, 2, 3, 4, 5, 6, 7])
  print("Evens:", e)
  print("Odds:", o)
