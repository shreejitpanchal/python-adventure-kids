id: lesson_554
title: "Subtraction: Level 27 ➖"
level: 554
objective: "Compare two different differences and find the bigger one."
explanation: |
  max() can compare the results of two subtractions, not just two plain numbers.

  max(10 - 3, 4 - 1) works out both differences first (7 and 3), then hands back the bigger one.
example_code: |
  print(max(10 - 3, 4 - 1))
starter_code: |
  print(max(10 - 3, 4 - 1))
challenge: |
  🎯 Challenge: Which is bigger: 15 - 4 or 9 - 1? Make Python find out.
expected_output: "11"
hints:
  - "Change the two problems to 15 - 4 and 9 - 1."
  - "It should look like: print(max(15 - 4, 9 - 1))"
