id: lesson_649
title: "Ask a Question: Level 30 🙋"
level: 649
objective: "Split two typed numbers apart and multiply them instead of adding."
explanation: |
  Same trick as before, but with a different operator at the end — once your two numbers are split apart and converted, you can do any kind of math with them.

  parts = line.split() breaks the typed line into two pieces. print(a * b) multiplies them together instead of adding.
example_code: |
  line = input("Type two numbers separated by a space: ")
  parts = line.split()
  a = int(parts[0])
  b = int(parts[1])
  print(a * b)
starter_code: |
  line = input("Type two numbers separated by a space: ")
  parts = line.split()
  a = int(parts[0])
  b = int(parts[1])
  print(a * b)
challenge: |
  🎯 Challenge: Type 3 6 (with a space between them) in the box below, then press RUN to see them multiplied!
expected_output: "Type two numbers separated by a space: 18"
input_prompt: "Type two numbers separated by a space:"
hints:
  - "Type 3 6 in the answer box above the RUN button, with a space between the two numbers."
  - "* multiplies the two numbers you split apart."
  - "You don't need to change the code — just type 3 6 and press RUN!"
