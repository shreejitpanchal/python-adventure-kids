id: lesson_339
title: "Ask a Question: Level 20 🙋"
level: 339
objective: "Read a typed number and compare it to a fixed number with >."
explanation: |
  You can compare a typed answer to a number, just like you would with any other number.

  n = int(input("Type a number: ")) stores your number. print(n > 10) checks if it's bigger than 10.
example_code: |
  n = int(input("Type a number: "))
  print(n > 10)
