id: lesson_513
title: "Numbers: Level 26 🔢"
level: 513
objective: "Practice using int() to turn text into a real number."
explanation: |
  Let's practice int() again — it converts text like "6" into a real number you can do math with.

  int("6") + 2 converts "6" into 6, then adds 2, giving 8.
example_code: |
  print(int("6") + 2)
starter_code: |
  print(int("6") + 2)
challenge: |
  🎯 Challenge: Convert the text "36" into a real number and add 9 to it.
expected_output: "45"
hints:
  - "Change \"6\" to \"36\", and 2 to 9."
  - "It should look like: print(int(\"36\") + 9)"
