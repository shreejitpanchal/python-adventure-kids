id: lesson_553
title: "Subtraction: Level 34 ➖"
level: 553
objective: "Show two calculated subtraction results inside one f-string sentence."
explanation: |
  An f-string can hold more than one calculation -- just use a separate pair of curly braces for each one.

  f"{10 - 3} and {30 - 12}" shows both differences side by side in one sentence.
example_code: |
  print(f"{10 - 3} and {30 - 12}")
starter_code: |
  print(f"{10 - 3} and {30 - 12}")
challenge: |
  🎯 Challenge: Can you show 25 - 9 and 40 - 15, both together in one sentence?
expected_output: "16 and 25"
hints:
  - "Change the two problems to 25 - 9 and 40 - 15."
  - "Each pair of curly braces holds its own calculation."
  - "It should look like: print(f\"{25 - 9} and {40 - 15}\")"
