id: ai_advanced_neuralnetworks_1
title: "What is a Neural Network? 🕸️"
level: 2020
objective: "Understand a neural network's basic building block: a neuron that weighs its input and decides whether to 'fire'."
explanation: |
  A neural network is a machine learning model loosely inspired by neurons in the brain. Each artificial "neuron" takes a number in, multiplies it by a weight (how important that input is), and compares the total against a threshold to decide whether to "fire" (activate) or stay quiet.
example_code: |
  input_value = 3
  weight = 2
  threshold = 10
  total = input_value * weight
  if total >= threshold:
      print("Neuron fires! Total: " + str(total))
  else:
      print("Neuron stays quiet. Total: " + str(total))
