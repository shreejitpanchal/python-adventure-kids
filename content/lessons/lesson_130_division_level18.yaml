id: lesson_130
title: "Division: Level 18 ➗"
level: 130
objective: "Divide two numbers, then square the result."
explanation: |
  You can combine / and ** — Python divides first, then raises that answer to a power.

  (20 / 4) ** 2 divides first (getting 5.0), then squares it: 25.0.
example_code: |
  print((20 / 4) ** 2)
starter_code: |
  print((20 / 4) ** 2)
challenge: |
  🎯 Challenge: Divide 30 / 5, then raise the result to the power of 2.
expected_output: "36.0"
hints:
  - "Change the division to 30 / 5, keep ** 2."
  - "It should look like: print((30 / 5) ** 2)"
