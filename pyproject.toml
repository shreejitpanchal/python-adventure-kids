[project]
name = "python-adventure"
version = "1.0.0"
description = "A gamified Python-learning adventure for kids"
# What the PACKAGED Flet app (Android/Windows via `flet build`) needs at
# runtime -- and nothing else. `flet build` reads this list in preference to
# requirements.txt, which is the developer environment (run.bat/run.sh) and
# also carries the CustomTkinter desktop app's deps and pytest; those are
# useless on a phone and were being bundled into every APK. Pillow is only
# imported by the CTk-only modules (app/ui/assets.py, game_window.py), and
# the app makes no network calls, so certifi isn't needed either.
dependencies = [
    "flet==0.86.5",
    "flet-audio==0.86.5",
    "pyyaml>=6.0",
]

[tool.flet]
product = "Python Adventure"
org = "com.shreejitpanchal"
company = "Shreejit Panchal"
copyright = "Copyright (C) 2026 Shreejit Panchal"

[tool.flet.app]
# `flet build` doesn't read .gitignore -- it zips the whole project root
# as the app payload by default (only "build" is excluded automatically),
# so anything not listed here rides along verbatim. Without this, a build
# was shipping the entire dev .venv (~80MB, and already redundant: real
# runtime deps are correctly resolved from requirements.txt separately
# into the app's actual Python bundle), full git history, the graphify
# knowledge-graph cache, and the developer's own local progress.sqlite3.
exclude = [
    ".venv",
    ".git",
    ".claude",
    ".pytest_cache",
    "__pycache__",
    "app-data",
    "graphify-out",
    "tests",
    "docs",
    "scripts",
]
